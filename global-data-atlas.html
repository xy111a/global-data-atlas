<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全球数据地图 · Global Data Atlas</title>
<style>
  :root{
    --bg:#05060a; --panel:rgba(12,18,28,0.82); --line:#13314a;
    --cyan:#00F0FF; --pink:#FF2E93; --gold:#FFD166; --muted:#7f93a8; --text:#dfeaf5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  #app{display:flex;flex-direction:column;height:100vh;}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;
    border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(0,240,255,0.06),transparent);}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px;}
  header h1 .en{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px;}
  .breadcrumb{font-size:13px;color:var(--muted);}
  .breadcrumb b{color:var(--cyan);font-weight:500;}
  .spacer{flex:1;}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{background:transparent;color:var(--muted);border:0;padding:7px 13px;font-size:13px;cursor:pointer;}
  .seg button.active{background:rgba(0,240,255,0.12);color:var(--cyan);}
  .btn{background:transparent;border:1px solid var(--line);color:var(--text);
    padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer;}
  .btn:hover{border-color:var(--cyan);}
  .btn.active{background:rgba(0,240,255,0.12);color:var(--cyan);border-color:var(--cyan);}  /* S2: 对比模式开启反馈 */
  #main{flex:1;position:relative;display:flex;}  /* relative 供 resetView 定位 */
  #chart{flex:1;min-width:0;}
  #panel{width:min(300px,28vw);border-left:1px solid var(--line);padding:18px;
    background:var(--panel);overflow:auto;}
  #panel h2{font-size:15px;margin:0 0 4px;}
  #panel .sub{color:var(--muted);font-size:12px;margin-bottom:16px;}
  .metric{margin-bottom:14px;}
  .metric .k{font-size:12px;color:var(--muted);}
  .metric .v{font-size:20px;font-weight:600;color:var(--cyan);}
  .metric .v.growth.pos{color:#00F0FF;}
  .metric .v.growth.neg{color:var(--gold);}
  .metric .v.growth.muted{color:#7f93a8;}
  .metric .v.muted{color:#5a6b7d;font-size:16px;}
  .metric .v.pink{color:var(--pink);}
  .hint{font-size:12px;color:var(--muted);line-height:1.7;border-top:1px dashed var(--line);
    padding-top:12px;margin-top:6px;}
  #loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(5,6,10,0.7);color:var(--cyan);font-size:14px;z-index:5;}
  #banner{position:absolute;left:14px;bottom:14px;font-size:12px;color:var(--muted);
    background:rgba(5,6,10,0.6);border:1px solid var(--line);border-radius:8px;padding:6px 10px;z-index:4;}
  #fatal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    color:var(--pink);font-size:14px;text-align:center;padding:30px;z-index:9;}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;
    border:1px solid var(--line);color:var(--muted);margin-top:6px;}

  #search{background:rgba(5,6,10,0.6);border:1px solid var(--line);color:var(--text);
    padding:7px 12px;border-radius:8px;font-size:13px;width:190px;outline:none;}
  #search:focus{border-color:var(--cyan);}

/* ===== 移动端响应式 (D) ===== */
@media(max-width:768px){
  body{font-size:13px;}
  #app{flex-direction:column; height:auto; min-height:100vh;}
  header{flex-wrap:wrap; gap:6px; padding:8px 10px;}
  #main{flex-direction:column;}
  #chart{width:100%;height:55vh; min-height:360px; flex:none;}
  #panel{width:100%; max-width:none; border-left:none; border-top:1px solid var(--line);
    max-height:45vh; overflow-y:auto;}
  #metricSeg{flex-wrap:wrap;}
  #metricSeg button{padding:5px 10px; font-size:12px; min-height:36px;}
  #search{max-width:160px; font-size:12px;}
  #crumb{font-size:12px; white-space:normal; word-break:break-all;}
  .rank-item{padding:6px 10px; font-size:12px;}
  h2{font-size:15px;} h3{font-size:14px;}
}
@media(max-width:480px){
  #chart{height:50vh; min-height:300px;}
  #metricSeg button{padding:4px 8px; font-size:11px;}
  #search{max-width:120px;}
}
  #rank{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px;}
  .rank-title{font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:.5px;}
  .rank-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;
    cursor:pointer;font-size:13px;}
  .rank-item:hover{background:rgba(0,240,255,0.08);}
  .rank-item .rk{color:var(--pink);font-weight:600;width:18px;text-align:center;}
  .rank-item .rn{flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank-item .rv{color:var(--cyan);font-size:12px;white-space:nowrap;}
  .rank-item .rg{font-size:11px;font-weight:600;white-space:nowrap;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,0.04);}
  .rank-item .rg.pos{color:#00F0FF;}
  .rank-item .rg.neg{color:var(--gold);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>全球数据地图<span class="en">GLOBAL DATA ATLAS</span></h1>
    <div class="breadcrumb" id="crumb">世界</div>
    <input id="search" placeholder="搜索国家 / 省份 / 城市…" />
    <div class="spacer"></div>
    <div class="seg" id="metricSeg"></div>
    <select id="yearSel" style="background:#0a1520;color:#9fb3c8;border:1px solid #1d5a72;border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;">
      <option value="2025" selected>2025</option>
      <option value="2024">2024</option>
      <option value="2023">2023</option>
    </select>
    <button class="btn" id="cmpBtn" title="点击开启/关闭对比模式，开启后点击地图区域加入对比列表">🔍 对比</button>
    <button class="btn" id="backBtn">← 返回世界</button>
  </header>
  <div id="main">
    <div id="chart"></div>
    <button id="resetView" title="地图被拖拽/缩放后，点击恢复初始视图" style="position:absolute;right:8px;top:8px;display:none;z-index:3;background:rgba(5,6,10,0.8);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;">⟲ 恢复视图</button>
    <div id="panel">
      <div id="compareBox" style="display:none;margin-bottom:12px;border:1px solid var(--cyan);border-radius:8px;padding:10px;background:rgba(0,240,255,0.05);"></div>
      <h2 id="pName">世界地图</h2>
      <div class="sub" id="pSub">加载中…</div>
      <div id="pMetrics"></div>

      <div id="trend" style="margin-top:14px;border-top:1px dashed var(--line);padding-top:10px;"></div>
      <div id="rank"></div>
    </div>
    <div id="loading">加载中…</div>
    <div id="banner"></div>
    <div id="fatal"></div>
  </div>
</div>

<script>
/* ============== 数据（公开整理近似值） ============== */
/* 国家：多年度序列（GDP=World Bank 当期USD$, 人口/面积；另含不变价GDP gdpKd 与 PPP不变价 gdpPpKd 用于真实增长计算），运行时按所选年份取数、GDP 按逐年平均市场汇率(USD/CNY)折算人民币(CNY) */
const COUNTRIES = Object.values(window.WB || {}).map(o => [o.cn, o.en, o.iso2, o.lng, o.lat]);
const BY_EN = {}; COUNTRIES.forEach(c=>BY_EN[c[1]]=c);
/* world.json 边界名 → WB en 名 别名表（ECharts 官方 world.json 用旧名/缩写，此处归一以便地图着色与点击）
   另收录 world.json 缺失边界但数据存在的国家，保证搜索/面板可用。 */
const EN_ALIAS = {
  "Côte d'Ivoire":"Cote d'Ivoire", "S. Sudan":"South Sudan", "Faeroe Is.":"Faroe Islands",
  "N. Mariana Is.":"Northern Mariana Islands", "St. Vin. and Gren.":"St. Vincent and the Grenadines",
  "Turks and Caicos Is.":"Turks and Caicos Islands", "Marshall Is.":"Marshall Islands",
  "Br. Virgin Is.":"British Virgin Islands", "St. Kitts-Nevis":"St. Kitts and Nevis",
  "U.S. Virgin Is.":"Virgin Islands (U.S.)", "Congo, Dem. Rep.":"Congo, Dem. Rep.",
  "Dem. Rep. Congo":"Congo, Dem. Rep.", "Macedonia":"North Macedonia", "Swaziland":"Eswatini",
  "Congo":"Congo, Rep.", "Korea":"Korea, Rep.", "Dem. Rep. Korea":"Korea, Dem. People's Rep.",
  "Nauru":"Naoero", "Macau":"Macao SAR, China", "Hong Kong":"Hong Kong SAR, China",
  "Curaçao":"Curacao", "Palestine":"West Bank and Gaza", "Jersey":"Channel Islands"
};
function enToWb(nm){ if(BY_EN[nm]) return nm; return EN_ALIAS[nm] || null; }
function wbForMapName(nm){ const k=enToWb(nm); return k ? BY_EN[k] : null; }
/* ============== METRICS 指标注册表（架构重构） ==============
   每个指标定义：label(显示名)、fmt(格式化)、unit(单位说明)、
   near(从区域数据取"某年最近可得值")、series(取多年序列)、growth(较基准年增长)。
   区域（国家/省/州/市）通过统一 reg 接口 {get, years, growth, name} 暴露数据，
   渲染层（地图着色/面板/排行/对比/趋势）全部读注册表，不再硬编码指标。 */
const METRICS = {
  gdp: {
    label:"GDP", fmt:fmtGDP, unit:"人民币元",
    near(o,year){ return (o&&o.get)?o.get("gdp",year):null; },
    series(o){ return (o&&o.gdpSeries)?o.gdpSeries():null; },
    growth(o,base){ return (o&&o.growth)?o.growth("gdp",base):null; }
  },
  pop: {
    label:"人口", fmt:fmtPop, unit:"人",
    near(o,year){ return (o&&o.get)?o.get("pop",year):null; },
    series(){ return null; }, growth(){ return null; }
  },
  area: {
    label:"面积", fmt:fmtArea, unit:"km²",
    near(o,year){ return (o&&o.get)?o.get("area",year):null; },
    series(){ return null; }, growth(){ return null; }
  },
  /* ===== 扩展指标（World Bank EXT，国家层） =====
     通用取数器：reg.ext(m, year) 返回最近可得值，缺失返回 null。
     省/州/市 reg 无 ext → 自动显示"暂无"，无需各自实现。 */
  trade: {
    label:"贸易占GDP", fmt:v=>fmtPct(v), unit:"% (出口+进口)/GDP",
    near(o,year){ return (o&&o.ext)?o.ext("trade",year):null; },
    series(){ return null; }, growth(){ return null; }
  },
  health: {
    label:"医疗支出", fmt:v=>fmtPct(v), unit:"% GDP",
    near(o,year){ return (o&&o.ext)?o.ext("health",year):null; },
    series(){ return null; }, growth(){ return null; }
  },
  edu: {
    label:"教育支出", fmt:v=>fmtPct(v), unit:"% GDP",
    near(o,year){ return (o&&o.ext)?o.ext("edu",year):null; },
    series(){ return null; }, growth(){ return null; }
  },
  life: {
    label:"预期寿命", fmt:v=>v!=null?v.toFixed(1)+" 岁":null, unit:"岁",
    near(o,year){ return (o&&o.ext)?o.ext("life",year):null; },
    series(){ return null; }, growth(){ return null; }
  },
  gdpcap: {
    label:"人均GDP", fmt:v=>v!=null?"$"+v.toFixed(0):null, unit:"USD(2015不变价)",
    near(o,year){ return (o&&o.ext)?o.ext("gdpcap",year):null; },
    series(){ return null; }, growth(){ return null; }
  },
  /* ===== Phase F2 新增指标 ===== */
  unemp: {
    label:"失业率", fmt:v=>fmtPct(v), unit:"% 劳动力",
    near(o,year){ return (o&&o.ext)?o.ext("unemp",year):null; },
    series(){ return null; }, growth(){ return null; }
  },
  internet: {
    label:"互联网普及", fmt:v=>fmtPct(v), unit:"% 人口",
    near(o,year){ return (o&&o.ext)?o.ext("internet",year):null; },
    series(){ return null; }, growth(){ return null; }
  },
  military: {
    label:"军费", fmt:v=>fmtPct(v), unit:"% GDP",
    near(o,year){ return (o&&o.ext)?o.ext("military",year):null; },
    series(){ return null; }, growth(){ return null; }
  }
};
function fmtPct(v){ return v==null?null:v.toFixed(1)+"%"; }
function metricLabel(m){ return (METRICS[m]||{}).label || m; }
function metricFmt(m,v){ const f=(METRICS[m]||{}).fmt; return f?f(v):v; }
/* 区域统一接口：把各类数据源包装成 reg {name, get, years, growth} */

/* 取某国在指定年份的指标值（缺失时取最近可得年份；GDP 由 USD 折算 CNY） */
function cMetric(iso2, m, year){
  const o = window.WB && window.WB[iso2]; if(!o || !o.years) return 0;
  year = year || dataYear;
  const yk = Object.keys(o.years).map(Number);
  const has = y => o.years[y] && (m==="area" ? o.years[y].area!=null : o.years[y][m]!=null);
  let pick = null;
  if(has(year)) pick = year;
  if(pick==null){
    const b = yk.filter(y=>y<=year && has(y)).sort((a,b)=>b-a)[0];
    const a = yk.filter(y=>y>year && has(y)).sort((a,b)=>a-b)[0];
    pick = (b!=null) ? b : (a!=null ? a : null);
  }
  if(pick==null) return null;
  let v = m==="gdp" ? o.years[pick].gdp : m==="pop" ? o.years[pick].pop : o.years[pick].area;
  if(v==null) return null;
  if(m==="gdp"){ const rate = (window.FXRATE && window.FXRATE[pick]) || USD_CNY; v = v * rate; }   // USD → CNY(元)，按实际采用年份的逐年平均市场汇率
  return v;
}
/* cMetric 实际采用的年份（用于面板显示，保证诚实） */
function cYear(iso2){
  const o = window.WB && window.WB[iso2]; if(!o || !o.years) return dataYear;
  const m = metric, year = dataYear;
  const yk = Object.keys(o.years).map(Number);
  const has = y => o.years[y] && (m==="area" ? o.years[y].area!=null : o.years[y][m]!=null);
  if(has(year)) return year;
  const b = yk.filter(y=>y<=year && has(y)).sort((a,b)=>b-a)[0];
  const a = yk.filter(y=>y>year && has(y)).sort((a,b)=>a-b)[0];
  return (b!=null) ? b : (a!=null ? a : year);
}
/* 较基准年实际增长%（基于不变价序列，剔除通胀与汇率扭曲）
   key: "gdpKd"=不变价GDP(2015基,USD$), "gdpPpKd"=PPP不变价(2017基)。缺失返回 null（诚实不显示）。 */
function cGrowth(iso2, base, key){
  const o = window.WB && window.WB[iso2]; if(!o || !o.years) return null;
  const yk = Object.keys(o.years).map(Number);
  const has = y => o.years[y] && o.years[y][key]!=null;
  function near(yr){ if(has(yr)) return yr;
    const b=yk.filter(y=>y<=yr&&has(y)).sort((a,b)=>b-a)[0];
    const a=yk.filter(y=>y>yr&&has(y)).sort((a,b)=>a-b)[0];
    return (b!=null)?b:(a!=null?a:null); }
  const yb=near(base), ys=near(dataYear);
  if(yb==null||ys==null) return null;
  const vb=o.years[yb][key], vs=o.years[ys][key];
  if(!vb) return null;
  return vs/vb - 1;
}
/* 增长百分比格式化：null→"—"，带正负号 */
function fmtGrowth(g){
  if(g==null) return "—";
  return (g>=0?"+":"") + (g*100).toFixed(1) + "%";
}
/* 按维度格式化增长/变化（L7）：life 用绝对变化（岁），其余用百分比增长 */
function fmtGrowthFor(m, g){
  if(g==null) return "—";
  if(m==="life") return (g>=0?"+":"") + g.toFixed(1) + " 岁";
  return (g>=0?"+":"") + (g*100).toFixed(1) + "%";
}


/* 统一货币：国家 GDP 来自 World Bank(当期USD$)，运行时按所选年份取数、按逐年平均市场汇率(USD/CNY)折算为人民币(CNY) */
const USD_CNY = 7.2;  // 固定兜底汇率（仅当某年 window.FXRATE 缺失时启用）；正常运行时用逐年平均市场汇率

/* 中国省份：gdp=GDP(亿元,2023), pop=常住人口(万人), area=面积(km²) */
const CN = {
  "广东":{pop:12706,area:179725,"adcode":440000},
  "江苏":{pop:8526,area:107200,"adcode":320000},
  "山东":{pop:10123,area:155800,"adcode":370000},
  "浙江":{pop:6627,area:105500,"adcode":330000},
  "河南":{pop:9815,area:167000,"adcode":410000},
  "四川":{pop:8368,area:486000,"adcode":510000},
  "湖北":{pop:5838,area:185900,"adcode":420000},
  "福建":{pop:4183,area:124000,"adcode":350000},
  "湖南":{pop:6568,area:211800,"adcode":430000},
  "安徽":{pop:6121,area:140100,"adcode":340000},
  "上海":{pop:2487,area:6340,"adcode":310000},
  "河北":{pop:7393,area:188800,"adcode":130000},
  "北京":{pop:2186,area:16410,"adcode":110000},
  "陕西":{pop:3956,area:205600,"adcode":610000},
  "江西":{pop:4515,area:166900,"adcode":360000},
  "重庆":{pop:3191,area:82400,"adcode":500000},
  "辽宁":{pop:4182,area:148000,"adcode":210000},
  "云南":{pop:4673,area:383100,"adcode":530000},
  "广西":{pop:5027,area:237600,"adcode":450000},
  "山西":{pop:3466,area:156700,"adcode":140000},
  "内蒙古":{pop:2396,area:1183000,"adcode":150000},
  "贵州":{pop:3856,area:176100,"adcode":520000},
  "新疆":{pop:2598,area:1660000,"adcode":650000},
  "天津":{pop:1363,area:11966,"adcode":120000},
  "黑龙江":{pop:3099,area:473000,"adcode":230000},
  "吉林":{pop:2339,area:187400,"adcode":220000},
  "甘肃":{pop:2465,area:425800,"adcode":620000},
  "海南":{pop:1043,area:35400,"adcode":460000},
  "宁夏":{pop:729,area:66400,"adcode":640000},
  "青海":{pop:594,area:722300,"adcode":630000},
  "西藏":{pop:365,area:1228400,"adcode":540000}
};
const PROV_ADCODE = {}; Object.keys(CN).forEach(k=>PROV_ADCODE[k]=CN[k].adcode);
/* 港澳省级（CN 常量无数据，但 100000.js 边界可点击；补充 adcode 使下钻可用） */
PROV_ADCODE["香港"]=810000; PROV_ADCODE["澳门"]=820000;


/* 美国各州：gdp=名义GDP(美元现价 万亿, 约2023 BEA)，pop=常住人口(人, Census 2023-07-01 估计)，
   area=总面积(km², 含水域, Census)。gdp 在下方统一折算为人民币元；pop/area 单位与全球一致。 */
const US_STATES_GDP = {
  "California":{gdp:3.9,pop:38965193,area:423967},
  "Texas":{gdp:2.6,pop:30503301,area:695662},
  "New York":{gdp:2.1,pop:19571216,area:141297},
  "Florida":{gdp:1.5,pop:22610726,area:170312},
  "Illinois":{gdp:1.0,pop:12549689,area:149995},
  "Pennsylvania":{gdp:0.99,pop:12961683,area:119280},
  "Ohio":{gdp:0.86,pop:11785935,area:116098},
  "Washington":{gdp:0.78,pop:7812880,area:184661},
  "New Jersey":{gdp:0.77,pop:9290841,area:22591},
  "Georgia":{gdp:0.74,pop:11029227,area:153910},
  "North Carolina":{gdp:0.73,pop:10835491,area:139391},
  "Massachusetts":{gdp:0.70,pop:7001399,area:27336},

/* 州 GDP 由 美元万亿 折算为 人民币元，与世界/中国单位统一（作为无时序州的兜底值） */
const RATE23 = (window.FXRATE && window.FXRATE["2023"]) || USD_CNY;  // 美国州为2023单年数据，用当年汇率折算
Object.keys(US_STATES_GDP).forEach(k=> US_STATES_GDP[k].gdp = US_STATES_GDP[k].gdp*RATE23*1e12);

/* 美国州 GDP 多年序列（BEA SAGDP1 现价, 百万美元）：按所选年份取数, 缺失取最近可得年
   注：BEA SAGDP2 = 现价（current dollars）；SAGDP1 才是 2017 链式不变价，勿混淆 */
function usGdpUsdM(name, year){            // 返回 USD 百万 (number) 或 null
  const ts = window.US_TS && window.US_TS[name];
  if(!ts) return null;
  const ys = ts.years;
  if(ys[year]!=null) return ys[year];
  const avail = Object.keys(ys).map(Number).sort((a,b)=>a-b);
  if(!avail.length) return null;
  let best = avail[0], bd = Math.abs(avail[0]-year);
  for(const y of avail){ const d=Math.abs(y-year); if(d<bd){bd=d;best=y;} }
  return ys[best];
}
function usGdpY(name, year){               // 返回 人民币元 (按逐年汇率折算)
  const m = usGdpUsdM(name, year);
  if(m==null) return null;
  const r = (window.FXRATE && window.FXRATE[year]) || USD_CNY;
  return m * r * 1e6;
}
function usGdpYear(name, year){            // 实际采用的年份（usGdpUsdM 回退后）
  const ts = window.US_TS && window.US_TS[name];
  if(!ts || !ts.years) return year;
  if(ts.years[year]!=null) return year;
  const avail = Object.keys(ts.years).map(Number).sort((a,b)=>a-b);
  if(!avail.length) return year;
  let best = avail[0], bd = Math.abs(avail[0]-year);
  for(const y of avail){ const d=Math.abs(y-year); if(d<bd){bd=d;best=y;} }
  return best;
}
function usGdpUsdT(name, year){            // 返回 美元 万亿 (用于悬浮提示)
  const m = usGdpUsdM(name, year);
  return m==null ? null : m/1e6;
}
function usNominalGrowth(name, baseYear){  // 较基准年 名义(现价)增长, 返回小数, 缺失返回 null
  const b = usGdpUsdM(name, baseYear), e = usGdpUsdM(name, dataYear);
  if(b==null || e==null || b===0) return null;
  return e/b - 1;
}

/* 中国省份 GDP 多年序列（维基 2000/2010/2020-2024 + 2025 初步核算, 人民币元）；按所选年份取数, 缺失取最近可得年 */
function cnGdpRMB(short, year){            // 返回 人民币元 (number) 或 null
  const o = window.CN_TS && window.CN_TS[short]; if(!o || !o.gdpRMB) return null;
  const ys = o.gdpRMB; if(ys[year]!=null) return ys[year];
  const avail = Object.keys(ys).map(Number).sort((a,b)=>a-b);
  if(!avail.length) return null;
  let best = avail[0], bd = Math.abs(avail[0]-year);
  for(const y of avail){ const d=Math.abs(y-year); if(d<bd){bd=d;best=y;} }
  return ys[best];
}
function cnGdpYear(short, year){           // cnGdpRMB 实际采用的年份（稀疏年份诚实标注）
  const o = window.CN_TS && window.CN_TS[short]; if(!o || !o.gdpRMB) return year;
  if(o.gdpRMB[year]!=null) return year;
  const avail = Object.keys(o.gdpRMB).map(Number).sort((a,b)=>a-b);
  if(!avail.length) return year;
  let best = avail[0], bd = Math.abs(avail[0]-year);
  for(const y of avail){ const d=Math.abs(y-year); if(d<bd){bd=d;best=y;} }
  return best;
}
function cnNominalGrowth(short, baseYear){ // 较基准年 名义(现价)增长, 返回小数, 缺失返回 null
  const b = cnGdpRMB(short, baseYear), e = cnGdpRMB(short, dataYear);
  if(b==null || e==null || b===0) return null;
  return e/b - 1;
}

/* ============== 统一区域接口 reg（架构重构核心） ==============
   每类区域实现同一接口：get(metric, year) / years(metric) / growth(metric, base)。
   国家/省/州/市的渲染、排行、对比、趋势全走 reg，METRICS 定义指标行为。 */
function regCountry(iso2){
  const o=window.WB&&window.WB[iso2]; if(!o) return null;
  return {
    name:o.cn, en:o.en, iso2,
    years:()=>Object.keys(o.years).map(Number).sort((a,b)=>a-b),
    get(m,year){ return cMetric(iso2,m,year); },
    /* 扩展指标（EXT）：按最近可得年份取数，缺失返回 null */
    ext(m,year){
      const d=window.EXT&&window.EXT[iso2]&&window.EXT[iso2][m];
      if(!d) return null;
      year=year||dataYear;
      if(d[year]!=null) return d[year];
      const avail=Object.keys(d).map(Number).sort((a,b)=>a-b);
      if(!avail.length) return null;
      let best=avail[0], bd=Math.abs(avail[0]-year);
      for(const y of avail){ const dd=Math.abs(y-year); if(dd<bd){bd=dd;best=y;} }
      return d[best];
    },
    growth(m,base){
      if(m==="gdp") return cGrowth(iso2,base,"gdpKd");  // 国家用不变价（真实增长）
      if(m==="pop") return cGrowth(iso2,base,"pop");    // 人口增长（WB pop 序列）
      if(m==="area") return cGrowth(iso2,base,"area");  // 面积变化（WB area 序列：测量修订/填海/领土变更）
      // EXT 扩展指标：trade/health/edu/life/gdpcap 较 base 年变化
      const d=window.EXT&&window.EXT[iso2]&&window.EXT[iso2][m];
      if(!d) return null;
      const ks=Object.keys(d).map(Number).sort((a,b)=>a-b);
      const near=yr=>{ if(d[yr]!=null)return yr; const b=ks.filter(y=>y<=yr&&d[y]!=null).pop(); const a=ks.filter(y=>y>yr&&d[y]!=null)[0]; return b!=null?b:(a!=null?a:null); };
      const yb=near(base), ys=near(dataYear);
      if(yb==null||ys==null) return null;
      const vb=d[yb], vs=d[ys];
      if(vb==null) return null;
      if(m==="life") return vs - vb;   // 预期寿命：绝对变化（岁）
      if(vb===0) return null;
      return vs/vb - 1;   // 相对增长率（trade/health/edu/gdpcap）
    },
    gdpSeries(){ const tr=countryTrend(iso2); return tr?{name:o.cn,years:tr.years,values:tr.values}:null; }
  };
}
function regProv(short){
  return {
    name:short, cn:short,
    years:()=>Object.keys((window.CN_TS&&window.CN_TS[short]&&window.CN_TS[short].gdpRMB)||{}).map(Number).sort((a,b)=>a-b),
    ext(){ return null; },   // 省级无 World Bank 扩展指标
    get(m,year){
      if(m==="gdp") return cnGdpRMB(short,year);
      const o=window.CN_TS&&window.CN_TS[short];
      if(m==="pop") return (o&&o.pop&&o.pop["2023"])||(CN[short]&&CN[short].pop*1e4)||null;
      if(m==="area") return (o&&o.area!=null)?o.area:(CN[short]&&CN[short].area)||null;
      return null;
    },
    growth(m,base){ return m==="gdp"?cnNominalGrowth(short,base):null; },
    gdpSeries(){ const tr=provTrend(short); return tr?{name:short,years:tr.years,values:tr.values}:null; }
  };
}
function regUSState(nm){
  return {
    name:nm, cn:nm,
    years:()=>Object.keys((window.US_TS&&window.US_TS[nm]&&window.US_TS[nm].years)||{}).map(Number).sort((a,b)=>a-b),

    get(m,year){

      if(m==="gdp"){ const y=usGdpY(nm,year); return y!=null?y:s.gdp; }
      if(m==="pop") return s.pop;

    },
    growth(m,base){ return m==="gdp"?usNominalGrowth(nm,base):null; },
    gdpSeries(){ const tr=usTrend(nm); return tr?{name:nm,years:tr.years,values:tr.values}:null; }
  };
}
function regCity(cm){

function getCityMetric(adcode, parentAdcode){

}
function cityMetricVal(cm, m){ m=m||metric;
  if(!cm) return 0;

/* 按需加载省级边界（Phase B）：file:// 下动态 script 标签（fetch 会被 CORS 拦截） */
function loadCnProvGeo(adcode){
  return new Promise((resolve,reject)=>{
    if(window.CN_PROV && window.CN_PROV[adcode]){ resolve(window.CN_PROV[adcode]); return; }
    const s=document.createElement("script");
    s.src=`vendor/cn/${adcode}.js`;
    s.onload=()=>{ const g=window.CN_PROV && window.CN_PROV[adcode]; g?resolve(g):reject(new Error("边界未注册 "+adcode)); };
    s.onerror=()=>reject(new Error("加载边界失败 "+adcode));
    document.head.appendChild(s);
  });
}

  const grRow=(label,val)=>[label, fmtGrowth(val), false, "growth "+(val==null?"muted":(val>=0?"pos":"neg"))];
  const rows=[["GDP ("+gdY+(gdY!==dataYear?" 回退":"")+")", fmtGDP(gd!=null?gd:0), false]];
  if(g25!=null && dataYear!=="2025") rows.push(["GDP (2025 初核)", fmtGDP(g25), false]);
  rows.push(["人口 (2023)", fmtPop(pop), false]);
  rows.push(["面积", fmtArea(area), true]);
  if(ng!=null && dataYear!=="2000") rows.push(grRow("较2000 名义增长", ng));
  if(rg25!=null) rows.push(["2025 实际增幅", (rg25*100).toFixed(1)+"%", false, "growth "+(rg25>=0?"pos":"neg")]);
  showMetrics(short, "中国省份 · " + dataYear, rows, "wiki");
  const tr=provTrend(short);
  if(tr) renderTrend([{name:short, years:tr.years, values:tr.values}], short+" · GDP 趋势", fmtGDP);
  else document.getElementById("trend").innerHTML="";
}

/* ============== 排行榜 + 搜索 ============== */
function renderRank(){
  const box=document.getElementById("rank");
  let items=[], unit=metricLabel(metric);
  if(currentLevel==="us"){
    items=Object.keys(US_STATES_GDP).map(k=>{
      const r=regUSState(k);
      return [k,k,regGet(r,metric,dataYear),"usstate"];})
      .sort((a,b)=>b[2]-a[2]).slice(0,10);
  } else if(currentLevel==="japan"){
    items=Object.keys(window.JP_METRICS||{}).map(k=>{
      const r=regJapanPref(k);
      return [k,k,regGet(r,metric,dataYear),"jppref"];})
      .sort((a,b)=>b[2]-a[2]).slice(0,10);
  } else if(currentLevel==="province"){
    items=currentProvData.filter(d=>d.cm)
      .map(d=>{ const cm=d.cm; const r=regCity(cm); const v=regGet(r,metric,dataYear); return [d.name, d.name, v, "city", d.adcode, d.parentAdcode]; })
      .sort((a,b)=>b[2]-a[2]).slice(0,10);
  } else if(currentLevel==="china"){
    items=Object.keys(CN).map(k=>{
      const r=regProv(k), v=regGet(r,metric,dataYear);
      return [k+"省",k,v,"prov"];})
      .filter(it=>it[2]!=null).sort((a,b)=>b[2]-a[2]).slice(0,10);
  } else if(currentLevel==="world"){
    items=COUNTRIES.map(c=>{
      const r=regCountry(c[2]);
      return [c[0],c[1],r?regGet(r,metric,dataYear):null,"country"];})
      .filter(it=>it[2]!=null).sort((a,b)=>b[2]-a[2]).slice(0,10);
  } else { box.innerHTML=""; return; }
  if(!items.length){ box.innerHTML=""; return; }
  const fmt=v=> metricFmt(metric,v);
  box.innerHTML=`<div class="rank-title">${unit} · TOP 10</div>`+items.map((it,i)=>
    `<div class="rank-item" data-type="${it[3]}" data-key="${it[1]}">
       <span class="rk">${i+1}</span><span class="rn">${it[0]}</span><span class="rv">${fmt(it[2])}</span></div>`).join("");
  box.querySelectorAll(".rank-item").forEach(el=>{
    el.onclick=()=>{
      const t=el.dataset.type, k=el.dataset.key;
      if(t==="country"){ const c=BY_EN[k]; if(!c)return; if(c[2]==="CN")loadChina(); else if(c[2]==="US")loadUS(); else showCountry(c); }
      else if(t==="prov"){ if(currentLevel!=="china") loadChina(); setTimeout(()=>showProvincePanel(k), currentLevel==="china"?0:700); }
      else if(t==="city"){ showCityPanel(it[0], it[4], it[5]); }
      else if(t==="usstate"){ if(currentLevel!=="us"){ loadUS(); setTimeout(()=>showUSStatePanel(k),80); } else showUSStatePanel(k); }
      else if(t==="jppref"){ if(currentLevel!=="japan"){ loadJapan(); setTimeout(()=>showJapanPrefPanel(k),80); } else showJapanPrefPanel(k); }
    };
  });
}
function doSearch(q){
  q=(q||"").trim().toLowerCase(); if(!q) return;
  const c=COUNTRIES.find(x=>x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));
  if(c){
    if(c[2]==="CN") loadChina();
    else if(c[2]==="US") loadUS();
    else if(c[2]==="JP") loadJapan();
    else showCountry(c);
    return;
  }
  const pk=Object.keys(CN).find(k=>k.toLowerCase().includes(q)||normProv(k).toLowerCase().includes(q));
  if(pk){ if(currentLevel!=="china") loadChina(); setTimeout(()=>showProvincePanel(pk), currentLevel==="china"?0:700); return; }
  if(window.US_GEO){
    const sk=Object.keys(US_STATES_GDP).find(k=>k.toLowerCase().includes(q));
    if(sk){ if(currentLevel!=="us") loadUS(); setTimeout(()=>showUSStatePanel(sk), currentLevel==="us"?0:700); return; }
  }
  /* 城市搜索（L5）：CITY_INDEX 离线索引 [城市名, 市adcode, 省adcode, 省名] */
  if(window.CITY_INDEX){
    const qq = q.replace(/(市|地区|自治州|盟)$/, "");
    const hit = window.CITY_INDEX.find(x => x[0].includes(q) || x[0].replace(/(市|地区|自治州|盟)$/,"").includes(qq) || qq.includes(x[0].replace(/(市|地区|自治州|盟)$/,"")));
    if(hit){
      const [cname, cadcode, padcode, pname] = hit;
      loadProvince(pname, padcode).then(()=>showCityPanel(cname, cadcode, padcode));
      return;
    }
  }
  showBanner("未找到匹配：「"+q+"」");
}

/* ============== 对比模式（Phase D 补齐） ============== */
let cmpMode=false, cmpList=[];   // cmpList: [{t:"country"|"prov"|"usstate", name, iso/name, en}]
function cmpGetData(it){
  const y=dataYear;
  let base={};
  if(it.t==="country"){ base={g:cMetric(it.k,"gdp",y), p:cMetric(it.k,"pop",y), a:cMetric(it.k,"area",y)}; }
  else if(it.t==="prov"){ const g=cnGdpRMB(it.k,y), o=window.CN_TS&&window.CN_TS[it.k];
    base={g, p:(o&&o.pop&&o.pop["2023"])?o.pop["2023"]:null, a:(o&&o.area)||null}; }
  else if(it.t==="usstate"){ base={g:usGdpY(it.k,y), p:(US_STATES_GDP[it.k]||{}).pop, a:(US_STATES_GDP[it.k]||{}).area}; }
  else if(it.t==="jppref"){ const d=window.JP_METRICS&&window.JP_METRICS[it.k]; if(!d) return null;
    base={g:d.gdp, p:d.pop, a:d.area}; }
  else if(it.t==="city"){ const cm=getCityMetric(it.k); if(!cm) return null;
    base={g:cm.gdp, p:cm.pop, a:cm.area}; }   // 数据已由 city_metrics.js 折算为元/人
  else return null;
  // 当前维度值：gdp/pop/area 用对应值；EXT 系指标（trade/health/edu/life/gdpcap）仅国家层有
  if(metric==="gdp") base.v=base.g;
  else if(metric==="pop") base.v=base.p;
  else if(metric==="area") base.v=base.a;
  else base.v = (it.t==="country"&&window.EXT&&window.EXT[it.k]&&window.EXT[it.k][metric]) ? (function(){const d=window.EXT[it.k][metric],yy=String(y);if(d[yy]!=null)return d[yy];const ks=Object.keys(d).map(Number).sort((a,b)=>a-b);return d[String(ks[ks.length-1])];})() : null;
  return base;
}
function cmpToggle(it){
  const i=cmpList.findIndex(x=>x.t===it.t&&x.k===it.k);
  if(i>=0) cmpList.splice(i,1); else cmpList.push(it);
  cmpRender();
}
function cmpRender(){
  const box=document.getElementById("compareBox"); if(!box) return;
  box.style.display = cmpMode ? "block" : "none";
  if(!cmpMode) return;
  if(!cmpList.length){ box.innerHTML=`<div class="rank-title">对比模式 · 点击地图区域加入</div>`; return; }
  const rows=cmpList.map(it=>{
    const d=cmpGetData(it);
    const v=d&&d.v!=null?metricFmt(metric,d.v):"—";      // 当前维度值（跟随切换）
    const g=d&&d.g!=null?fmtGDP(d.g):"—", p=d&&d.p!=null?fmtPop(d.p):"—", a=d&&d.a!=null?fmtArea(d.a):"—";
    return `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #0e2233;font-size:12px;">
      <button class="cmp-del" data-k="${it.t}:${it.k}" style="background:transparent;border:1px solid var(--line);color:var(--pink);border-radius:4px;width:18px;height:18px;line-height:14px;cursor:pointer;font-size:10px;">×</button>
      <span style="flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${it.name}</span>
      <span style="color:var(--cyan);font-weight:600;font-size:12px;">${v}</span>
      <span style="color:#9fb3c8;font-size:10px;">${g} · ${p} · ${a}</span></div>`;
  }).join("");
  // 对比列跟随当前维度（L6 修复）：标题标注当前指标
  box.innerHTML=`<div class="rank-title">对比 · ${metricLabel(metric)}<span style="float:right;color:var(--pink);cursor:pointer;" onclick="cmpClear()">清空</span></div>${rows}`;
  box.querySelectorAll(".cmp-del").forEach(el=>{
    el.onclick=()=>{ const [t,k]=el.dataset.k.split(":"); cmpToggle({t,k,name:""}); };
  });
}
function cmpClear(){ cmpList=[]; cmpRender(); }
function cmpHandleClick(type, name, key){
  cmpToggle({t:type, name, k:key});
  return true;
}

/* ============== 交互 ============== */
/* 交互：单击显示内容（260ms 防抖，避免双击误触发），双击下钻 */
let clickTimer=null;
function onChartClick(p){
  if(clickTimer){ clearTimeout(clickTimer); clickTimer=null; }
  clickTimer=setTimeout(()=>{ clickTimer=null; showContentFor(p); }, 260);
}
function onChartDblClick(p){
  if(clickTimer){ clearTimeout(clickTimer); clickTimer=null; }
  drillDownFor(p);
}
/* 单击：显示该区域内容/加入对比（不下钻） */
function showContentFor(p){
  if(cmpMode){
    if(currentLevel==="world"){
      const c=p.data&&p.data.cn; if(!c) return;
      cmpHandleClick("country", c[0], c[2]);   // 所有国家（含 CN/US/JP）都可加入对比
    } else if(currentLevel==="china"){
      const nm=normProv(p.name); if(PROV_ADCODE[nm]) cmpHandleClick("prov", nm, nm);
    } else if(currentLevel==="us"){
      cmpHandleClick("usstate", p.name, p.name);
    } else if(currentLevel==="japan"){
      cmpHandleClick("jppref", p.name, p.name);
    } else if(currentLevel==="province"){
      const d=p.data; if(d&&d.cm) cmpHandleClick("city", d.name, d.adcode);
    }
    cmpRender(); renderTrendCompare(cmpList.map(it=>{const d=cmpGetData(it); return {name:it.name, val:d&&d.v!=null?d.v:0};}), "对比 · "+metricLabel(metric), v=>metricFmt(metric,v));
    return;
  }
  if(currentLevel==="world"){
    const c=p.data&&p.data.cn; if(!c) return;
    showCountry(c);   // 所有国家（含 CN/US/JP）单击都显示面板
  } else if(currentLevel==="china"){
    const nm=normProv(p.name); if(PROV_ADCODE[nm]) showProvincePanel(nm);
  } else if(currentLevel==="us"){
    showUSStatePanel(p.name);
  } else if(currentLevel==="japan"){
    showJapanPrefPanel(p.name);
  } else if(currentLevel==="province"){
    const d=p.data; if(d&&d.cm) showCityPanel(d.name, d.adcode, d.parentAdcode);
  }
}
/* 双击：下钻（仅可下钻层级） */
function drillDownFor(p){
  if(currentLevel==="world"){
    const c=p.data&&p.data.cn; if(!c) return;
    if(c[2]==="CN") loadChina();
    else if(c[2]==="US") loadUS();
    else if(c[2]==="JP") loadJapan();
    else showContentFor(p);   // 无下钻目标：退化为显示面板
  } else if(currentLevel==="china"){
    const nm=normProv(p.name); const adcode=PROV_ADCODE[nm];
    if(adcode) loadProvince(nm, adcode);
  }
  /* us / japan / province 层无下一级，双击忽略 */
}

/* ============== 启动 ============== */
window.addEventListener("load", ()=>{
  if(typeof echarts==="undefined"){
    document.getElementById("fatal").style.display="flex";
    document.getElementById("fatal").textContent="echarts 未能加载（vendor/echarts.min.js 缺失或被拦截）。";
    return;
  }
  chart = echarts.init(document.getElementById("chart"));
  chart.on("click", onChartClick);
  chart.on("dblclick", onChartDblClick);   // 双击下钻（单击已防抖 260ms）
  /* I5: 缩放/平移后显示重置按钮 */
  chart.on("georoam", ()=>{ document.getElementById("resetView").style.display="block"; });
  document.getElementById("resetView").addEventListener("click", ()=>{
    chart.dispatchAction({type:"restore"});
    document.getElementById("resetView").style.display="none";
  });

  /* 指标按钮由 METRICS 注册表动态生成：加新维度只需在 METRICS 注册，按钮自动出现 */
  (function(){
    const seg=document.getElementById("metricSeg");
    let first=true;
    Object.keys(METRICS).forEach(m=>{
      const b=document.createElement("button");
      b.dataset.m=m; b.className=first?"active":""; b.textContent=METRICS[m].label;
      seg.appendChild(b); first=false;
    });
  })();

  const gj = window.WORLD_GEO;
  if(gj){ worldGeo=gj; echarts.registerMap("world", gj); }
  else { showBanner("警告：world.js 未加载，世界地图不可用"); }
  renderWorld2D();          // 默认 2D 平面地图
  renderRank();

  document.getElementById("metricSeg").addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b)return;
    metric=b.dataset.m; [...e.currentTarget.children].forEach(x=>x.classList.toggle("active",x===b));
    if(currentLevel==="world"){ renderWorld2D(); }
    else if(currentLevel==="china") loadChina();
    else if(currentLevel==="province"){ if(currentProvName && currentProvAdcode) loadProvince(currentProvName, currentProvAdcode); else loadChina(); }
    else if(currentLevel==="us") loadUS();
    renderRank();
    if(cmpMode){ cmpRender(); renderTrendCompare(cmpList.map(it=>{const d=cmpGetData(it); return {name:it.name, val:d&&d.v!=null?d.v:0};}), "对比 · "+metricLabel(metric), v=>metricFmt(metric,v)); }   // 维度切换时对比跟随刷新
  });
  /* 年份选择器 (C) — 多年度由 World Bank(2000-2024) 驱动 */
  (function(){
    const sel=document.getElementById("yearSel");
    if(window.WB){
      const yrs=new Set();
      Object.values(window.WB).forEach(o=>Object.keys(o.years).forEach(y=>yrs.add(+y)));
      const arr=[...yrs].sort((a,b)=>b-a);
      if(!arr.includes(2025)) arr.unshift(2025);   // 省级有 2025 初核，纳入下拉使选择器成为唯一年份来源（国家/州缺 2025 时按最近年回退）
      sel.innerHTML=arr.map(y=>"<option value=\""+y+"\""+(String(y)==="2025"?" selected":"")+">"+y+"</option>").join("");
      dataYear="2025";   // 默认最新年份（省 2025 初核；国家/州按最近年回退并诚实标注）
    }
  })();
  /* 按当前 dataYear 重绘当前层（年份下拉/播放动画共用） */
  function redrawByYear(){
    if(currentLevel==="world"){ renderWorld2D(); }
    else if(currentLevel==="china") loadChina();
    else if(currentLevel==="province" && currentProvName) loadProvince(currentProvName, currentProvAdcode);
    else if(currentLevel==="us") loadUS();
    renderRank();
  }
  document.getElementById("yearSel").addEventListener("change", e=>{
    dataYear = e.target.value;
    redrawByYear();
  });
  document.getElementById("backBtn").addEventListener("click", ()=>{
    // 统一返回逻辑（L6/I2）：逐级返回 + 面包屑一致
    if(currentLevel==="province") goLevel("china");
    else if(currentLevel==="china") goLevel("world");
    else if(currentLevel==="us") goLevel("world");
    else if(currentLevel==="japan") goLevel("world");
    else goLevel("world");   // world 层：回到世界（重绘无副作用）
  });
  /* ESC 键返回上一级 */
  window.addEventListener("keydown", e=>{ if(e.key==="Escape"){ document.getElementById("backBtn").click(); } });
  const searchEl=document.getElementById("search");
  searchEl.addEventListener("keydown", e=>{ if(e.key==="Enter") doSearch(e.target.value); });
  searchEl.addEventListener("blur", e=>{ /* 不搜索：避免点击地图/排行时误触发跳转（M10 修复） */ });
  document.getElementById("cmpBtn").addEventListener("click", ()=>{
    cmpMode=!cmpMode;
    document.getElementById("cmpBtn").classList.toggle("active", cmpMode);
    if(!cmpMode){ cmpClear(); document.getElementById("trend").innerHTML=""; renderRank(); }
    else cmpRender();
  });
  window.addEventListener("resize", ()=>chart && chart.resize());
});
</script>
