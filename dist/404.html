<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面不存在 · Global Data Atlas</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root{ --bg:#05060a; --cyan:#00F0FF; --muted:#7f93a8; --text:#dfeaf5; --line:#13314a; }
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(900px 600px at 20% -10%, rgba(0,240,255,.06), transparent 60%), var(--bg);
      color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
    .card{max-width:420px;padding:36px 32px;border:1px solid var(--line);border-radius:14px;
      background:rgba(12,18,28,.82);text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.45);}
    .code{font-size:48px;font-weight:600;color:var(--cyan);letter-spacing:2px;margin:0 0 8px;}
    h1{font-size:18px;margin:0 0 10px;font-weight:600;}
    p{font-size:13.5px;color:var(--muted);margin:0 0 22px;line-height:1.7;}
    a{display:inline-block;margin:0 8px;padding:8px 16px;border:1px solid var(--line);
      border-radius:8px;color:var(--text);text-decoration:none;font-size:13px;}
    a:hover{border-color:var(--cyan);color:var(--cyan);}
  </style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>页面不存在</h1>
    <p>你访问的地址没有对应内容。可以回到地图首页，或打开区域对比页。</p>
    <a href="/">← 数据地图</a>
    <a href="/compare">区域对比</a>
  </div>
</body>
</html>
