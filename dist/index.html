<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全球数据地图 · Global Data Atlas</title>
<style>
  :root{
    /* 品牌令牌（数据语义，沿用） */
    --bg:#05060a; --panel:rgba(12,18,28,0.82); --line:#13314a;
    --cyan:#00F0FF; --pink:#FF2E93; --gold:#FFD166; --muted:#7f93a8; --text:#dfeaf5;
    /* 质感/光效令牌（Open Design 再设计） */
    --panel-solid:#0c121c;                /* 输入框实底（聚焦态） */
    --panel-float:rgba(13,20,31,0.92);    /* 悬浮层（tooltip/banner/dropdown） */
    --line-soft:rgba(19,49,74,.45);       /* 面板内部弱分隔线 */
    --line-bright:rgba(0,240,255,.35);    /* hover 描边微亮 */
    --line-top:linear-gradient(90deg,transparent,rgba(0,240,255,.5),rgba(255,46,147,.28),transparent);  /* 顶部发丝高光 */
    --hover:rgba(0,240,255,.06);          /* hover 遮罩 */
    --hover-strong:rgba(0,240,255,.10);   /* 选中/更强 hover */
    --pressed:rgba(0,240,255,.14);        /* active 按压 */
    --glow-sm:0 0 10px rgba(0,240,255,.14);
    --glow-md:0 0 22px rgba(0,240,255,.22);
    --shadow-panel:0 14px 40px rgba(0,0,0,.45);
    --shadow-float:0 18px 50px rgba(0,0,0,.55);
    /* 结构令牌 */
    --num:tabular-nums;
    --r-sm:6px; --r-md:10px; --r-lg:14px;
    --t-fast:.14s ease; --t-med:.22s ease;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  body{
    background:
      radial-gradient(1100px 700px at 12% -8%, rgba(0,240,255,.05), transparent 60%),
      radial-gradient(900px 600px at 108% 112%, rgba(255,46,147,.04), transparent 60%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(0,240,255,.25);}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px;}
  *::-webkit-scrollbar{width:8px;height:8px;}
  *::-webkit-scrollbar-thumb{background:rgba(19,49,74,.7);border-radius:4px;}
  *::-webkit-scrollbar-track{background:transparent;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  #app{display:flex;flex-direction:column;height:100vh;}
  header{position:relative;z-index:20;display:flex;flex-direction:column;gap:10px;padding:12px 20px;
    border-bottom:1px solid var(--line);
    background:color-mix(in oklab, var(--bg) 72%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 30px rgba(0,0,0,.25);}
  header::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
    background:var(--line-top);opacity:.55;pointer-events:none;}   /* 顶部发丝高光 */
  .tb-main{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0;}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px;white-space:nowrap;}
  header h1 .en{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px;}
  .breadcrumb{font-size:13px;color:var(--muted);}
  .breadcrumb b{color:var(--cyan);font-weight:500;position:relative;}
  .breadcrumb b::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;
    background:var(--cyan);box-shadow:var(--glow-sm);}   /* 当前层级发光下划线 */
  .tb-actions{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;}
  .seg{display:flex;gap:2px;padding:3px;
    background:rgba(10,16,26,.55);border:1px solid var(--line);border-radius:var(--r-lg);}
  .seg button{position:relative;background:transparent;color:var(--muted);border:0;padding:6px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap;border-radius:var(--r-sm);
    transition:color var(--t-fast),background var(--t-fast);}
  .seg button:hover{color:var(--text);background:var(--hover);}
  .seg button:active{background:var(--pressed);}
  .seg button.active{color:var(--cyan);font-weight:500;text-shadow:0 0 12px rgba(0,240,255,.35);}
  .seg button.disabled{opacity:.3;cursor:not-allowed;pointer-events:none;}   /* 当前层级不可用的指标 */
  .seg button.active::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;border-radius:2px;
    background:var(--cyan);box-shadow:0 0 8px rgba(0,240,255,.4);}   /* active 发光条 */
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);
    padding:8px 12px;border-radius:var(--r-md);font-size:13px;cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;
    transition:color var(--t-fast),background var(--t-fast),border-color var(--t-fast),box-shadow var(--t-med);}
  .btn:hover{color:var(--text);border-color:var(--line-bright);background:var(--hover);}
  .btn:active{background:var(--pressed);transform:translateY(.5px);}
  .btn.active{color:var(--cyan);border-color:var(--line-bright);background:var(--hover-strong);box-shadow:var(--glow-sm);}  /* S2: 对比模式开启反馈 */
  #search{background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:8px 12px;border-radius:var(--r-md);font-size:13px;width:200px;outline:none;caret-color:var(--cyan);
    transition:border-color var(--t-fast),box-shadow var(--t-med),background var(--t-fast);}
  #search::placeholder{color:color-mix(in oklab, var(--muted) 70%, transparent);}
  #search:hover{border-color:var(--line-bright);}
  #search:focus{border-color:var(--cyan);background:var(--panel-solid);box-shadow:var(--glow-sm),inset 0 0 0 1px var(--line-bright);}
  #yearSel{appearance:none;-webkit-appearance:none;background:var(--panel);color:var(--muted);
    border:1px solid var(--line);border-radius:var(--r-md);padding:8px 30px 8px 12px;font-size:13px;cursor:pointer;font-variant-numeric:var(--num);
    transition:border-color var(--t-fast),box-shadow var(--t-med),background var(--t-fast);}
  #yearSel:hover{border-color:var(--line-bright);}
  #yearSel:focus{outline:none;border-color:var(--cyan);box-shadow:var(--glow-sm);background:var(--panel-solid);}
  #main{flex:1;position:relative;display:flex;}  
  #chart{flex:1;min-width:0;position:relative;border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden;
    box-shadow:inset 0 0 70px rgba(0,0,0,.5), var(--shadow-panel);margin:12px;outline:none;}   /* outline:none 供 focus 自定义 */
  #chart:focus{outline:2px solid var(--cyan);outline-offset:2px;box-shadow:inset 0 0 70px rgba(0,0,0,.5), var(--glow-md);}   /* P1b: 地图容器聚焦态 */
  .rank-item:focus-visible{outline:2px solid var(--cyan);outline-offset:1px;background:var(--hover);}   /* P1b: 排行项聚焦态 */
  #panel{position:relative;width:clamp(300px,26vw,380px);border-left:1px solid var(--line);padding:18px;
    background:var(--panel);overflow:auto;
    box-shadow:var(--shadow-panel);}  /* 宽屏可增宽（L6）；面板投影 */
  #panel.collapsed{display:none;}   /* 折叠：地图全宽 */
  #panelFold{position:absolute;top:8px;right:10px;z-index:7;background:var(--panel-float);border:1px solid var(--line);
    color:var(--muted);border-radius:var(--r-md);padding:3px 8px;font-size:12px;cursor:pointer;
    backdrop-filter:blur(8px);transition:color var(--t-fast),border-color var(--t-fast);}
  #panelFold:hover{color:var(--cyan);border-color:var(--cyan);}
  #panelFloat{position:fixed;right:18px;bottom:24px;z-index:20;display:none;align-items:center;gap:6px;
    background:var(--panel-float);border:1px solid var(--cyan);color:var(--cyan);border-radius:999px;
    padding:9px 16px;font-size:13px;cursor:pointer;box-shadow:var(--glow-sm),var(--shadow-panel);
    backdrop-filter:blur(10px);}
  #panelFloat:hover{background:var(--cyan);color:#04101c;}
  #panel::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
    background:var(--line-top);opacity:.4;pointer-events:none;}   /* 面板顶部发丝高光 */
  #panel h2{font-size:15px;margin:0 0 4px;}
  #panel .sub{color:var(--muted);font-size:12px;margin-bottom:8px;}
  .metric{margin-bottom:14px;}
  .metric .k{font-size:12px;color:var(--muted);}
  .metric .v{font-size:20px;font-weight:600;color:var(--cyan);font-variant-numeric:var(--num);text-shadow:var(--glow-sm);}
  .metric .v.growth.pos{color:#00F0FF;}
  .metric .v.growth.neg{color:var(--gold);}
  .metric .v.growth.muted{color:#7f93a8;}
  .metric .v.muted{color:#8fa2b5;font-size:16px;}  /* 提亮：对比度 3.7→5.5 (L1) */
  .metric .v.pink{color:var(--pink);}
  .hint{font-size:12px;color:var(--muted);line-height:1.7;border-bottom:1px dashed var(--line-soft);
    padding-bottom:12px;margin-bottom:10px;}   /* 上移到指标卡上方：来源/年份标签在顶部 */
  #loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(5,6,10,0.7);color:var(--cyan);font-size:14px;z-index:5;}
  #banner{position:absolute;right:16px;bottom:16px;left:auto;font-size:12px;color:var(--muted);
    background:var(--panel-float);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px;z-index:4;
    backdrop-filter:blur(8px);box-shadow:var(--shadow-float),var(--glow-sm);}  /* 悬浮层第3层 */
  #fatal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    color:var(--pink);font-size:14px;text-align:center;padding:30px;z-index:9;}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;
    border:1px solid var(--line);color:var(--muted);margin-top:6px;}
  /* ===== 区域仪表盘（统一） ===== */
  .dash-head{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
  .dash-title-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .dash-title-row h2{margin:0;}
  .dash-level{font-size:11px;color:var(--cyan);border:1px solid var(--line-bright);border-radius:10px;padding:1px 8px;font-weight:500;}
  .dash-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px;}
  .dash-stat{background:rgba(10,16,26,.4);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:10px 12px;
    display:flex;flex-direction:column;gap:4px;min-width:0;}
  .dash-stat .k{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dash-stat .v{font-size:18px;font-weight:600;color:var(--cyan);font-variant-numeric:var(--num);line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:var(--glow-sm);}
  .dash-stat .v.gold{color:var(--gold);}
  .dash-stat .v.pink{color:var(--pink);}
  .dash-stat .d{font-size:11px;color:#7f93a8;font-variant-numeric:var(--num);}
  .dash-stat .d.up{color:#00F0FF;} .dash-stat .d.down{color:var(--gold);}
  .dash-insight{margin-top:14px;border-top:1px dashed var(--line-soft);padding-top:12px;
    display:flex;flex-direction:column;gap:8px;}
  .dash-insight-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);}
  .dash-insight-row b{color:var(--text);font-weight:500;font-variant-numeric:var(--num);}
  .dash-insight-row b.pos{color:#00F0FF;} .dash-insight-row b.neg{color:var(--gold);}
  .dash-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}   /* 移到标题下方（pHint 后），按钮更显眼 */

/* ===== 响应式断点（排版审计 P1/P2/P3） ===== */
@media(max-width:1200px){
  header{flex-wrap:wrap;gap:8px;}
  header h1 .en{display:none;}   /* 隐藏英文副标题节省宽度 */
  #search{width:150px;}
}
@media(max-width:1024px){
  #metricSeg{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}  /* 指标按钮横向滚动，避免堆多行 */
  #metricSeg button{flex:none;}
  #main{flex-direction:column;}   /* 面板转全宽（原 768 断点提前到 1024） */
  #chart{width:100%;height:55vh;min-height:360px;flex:none;margin:0;border-radius:0;border-left:none;border-right:none;}
  #panel{width:100%;max-width:none;border-left:none;border-top:1px solid var(--line);
    max-height:45vh;overflow-y:auto;}
}
@media(max-width:768px){
  body{font-size:13px;}
  #app{flex-direction:column; height:auto; min-height:100vh;}
  header{flex-wrap:wrap; gap:6px; padding:8px 10px;}
  .tb-main{gap:8px;}
  #panelFold{display:none;}   /* 窄屏面板在下方，无需折叠 */
  #panelFloat{display:none!important;}
  .tb-actions{gap:6px;}
  #chart{width:100%;height:55vh; min-height:360px; flex:none;}
  #panel{width:100%; max-width:none; border-left:none; border-top:1px solid var(--line);
    max-height:45vh; overflow-y:auto;}
  #metricSeg{flex-wrap:nowrap; overflow-x:auto; max-width:100vw;}   /* 横向滚动单行 */
  #metricSeg button{padding:5px 10px; font-size:12px; min-height:36px;}
  #search{max-width:160px; font-size:12px;}
  #crumb{font-size:12px; white-space:normal; word-break:break-word; overflow-wrap:anywhere;}
  .rank-item{padding:6px 10px; font-size:12px;}
  h2{font-size:15px;} h3{font-size:14px;}
}
@media(max-width:480px){
  #chart{height:50vh; min-height:300px;}
  #metricSeg button{padding:4px 8px; font-size:11px;}
  #search{max-width:120px;}
  .tb-actions{width:100%;}   /* P2: 操作栏占满一行，内部换行不裁切 */
  .tb-actions .btn{padding:6px 8px; font-size:12px; flex:0 1 auto; min-width:0;}
  #yearSel{padding:6px 8px; font-size:12px;}
}
@media(min-width:1600px){
  #panel{width:clamp(340px,22vw,460px);}   /* 宽屏放宽：排行/趋势更舒适 */
}
  #rank{margin-top:16px;border-top:1px dashed var(--line-soft);padding-top:12px;max-height:340px;overflow-y:auto;}   /* 全量排行可滚动（默认顶部） */
  .trend-scroll{max-height:360px;overflow-y:auto;}   /* 与 #rank 一致：容器 CSS 滚动，滚轮直接滚（默认显示头部） */
  .rank-title{font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:.5px;font-weight:600;}
  .rank-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;
    cursor:pointer;font-size:13px;transition:background var(--t-fast);}
  .rank-item:hover{background:var(--hover);}
  .rank-item .rk{color:var(--pink);font-weight:600;width:18px;text-align:center;font-variant-numeric:var(--num);}
  .rank-item .rn{flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank-item .rv{color:var(--cyan);font-size:12px;white-space:nowrap;flex:0 1 auto;max-width:45%;text-align:right;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:var(--num);}  /* 窄面板下不挤占名称（P2） */
  /* ===== Footer 数据来源汇总（DoD 交付项） ===== */
  footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 18px;
    padding:8px 20px;border-top:1px solid var(--line);
    background:color-mix(in oklab, var(--bg) 72%, transparent);
    font-size:11.5px;color:var(--muted);line-height:1.6;}
  .footer-sources{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 13px;}
  .footer-sources b{color:var(--text);font-weight:600;letter-spacing:.4px;}
  .footer-sources span{opacity:.82;}
  .footer-note{opacity:.7;text-align:right;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="tb-main">
      <div class="brand">
        <h1>全球数据地图<span class="en">GLOBAL DATA ATLAS</span></h1>
        <div class="breadcrumb" id="crumb">世界</div>
      </div>
      <div class="tb-actions">
        <input id="search" placeholder="搜索国家 / 省份 / 城市…" aria-label="搜索国家、省份或城市" />
        <select id="yearSel" aria-label="选择年份">
          <option value="2025" selected>2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
        </select>
        <button class="btn" id="cmpBtn" title="显示/隐藏对比列表；在区域面板点『＋ 加入对比』收集条目">🔍 对比</button>
        <button class="btn" id="backBtn" aria-label="返回上一级">← 返回世界</button>
      </div>
    </div>
    <div class="seg" id="metricSeg" role="group" aria-label="选择指标"></div>
  </header>
  <div id="main">
    <div id="chart" tabindex="0" role="application" aria-label="行政区划地图（双击区域下钻，单击查看数据）"></div>
    <!-- I5: 缩放已锁死（roam:false），无需恢复视图按钮 -->
    <div id="panel">
      <button id="panelFold" title="收起面板" aria-label="收起数据面板">▸</button>
      <div id="compareBox" style="display:none;position:sticky;top:0;z-index:6;background:var(--panel);margin-bottom:12px;border:1px solid var(--cyan);border-radius:8px;padding:10px;box-shadow:var(--shadow-panel);"></div>
      <h2 id="pName">世界地图</h2>
      <div class="sub" id="pSub">加载中…</div>
      <div class="hint" id="pHint"></div>
      <div id="pActions"></div>
      <div id="pMetrics"></div>
      <div id="trend" style="margin-top:14px;border-top:1px dashed var(--line);padding-top:10px;"></div>
      <div id="rank"></div>
    </div>
    <div id="loading">加载中…</div>
    <div id="banner"></div>
    <div id="fatal"></div>
    <button id="panelFloat" title="展开数据面板" aria-label="展开数据面板">📊 数据面板</button>
  </div>
  <footer>
    <div class="footer-sources">
      <b>数据来源</b>
      <span>World Bank · 国家 GDP/人口/面积 + 扩展指标（2000–2024）</span>
      <span>维基百科 · 中国省/市 GDP（五经普修订）</span>
      <span>BEA + Census · 美国州</span>
      <span>日本内阁府 · 都道府县（2021）</span>
      <span>DataV GeoAtlas · 中国行政区边界</span>
    </div>
    <div class="footer-note">货币统一折算人民币（逐年平均汇率）· 各面板标注实际年份 · 单击查看数据 / 双击下钻</div>
  </footer>
</div>

<script src="vendor/echarts.min.js"></script>
<script src="vendor/world.js"></script>
<script src="vendor/jp_metrics.js"></script>
<script src="vendor/us_states_bea.js"></script>
<script src="vendor/cn/city_metrics.js"></script>
<script src="vendor/cn/city_index.js"></script>
<script src="vendor/cn/city_ts.js"></script>
<script src="vendor/countries_wb.js"></script>
<script src="vendor/fxrate.js"></script>
<script src="vendor/cn_prov_ts.js"></script>
<script>
/* ============== 数据（公开整理近似值） ============== */
/* 国家：多年度序列（GDP=World Bank 当期USD$, 人口/面积；另含不变价GDP gdpKd 与 PPP不变价 gdpPpKd 用于真实增长计算），运行时按所选年份取数、GDP 按逐年平均市场汇率(USD/CNY)折算人民币(CNY) */
const COUNTRIES = Object.values(window.WB || {}).map(o => [o.cn, o.en, o.iso2, o.lng, o.lat]);
const BY_EN = {}; COUNTRIES.forEach(c=>BY_EN[c[1]]=c);
/* world.json 边界名 → WB en 名 别名表（ECharts 官方 world.json 用旧名/缩写，此处归一以便地图着色与点击）
   另收录 world.json 缺失边界但数据存在的国家，保证搜索/面板可用。 */
const EN_ALIAS = {
  "Côte d'Ivoire":"Cote d'Ivoire", "S. Sudan":"South Sudan", "Faeroe Is.":"Faroe Islands",
  "N. Mariana Is.":"Northern Mariana Islands", "St. Vin. and Gren.":"St. Vincent and the Grenadines",
  "Turks and Caicos Is.":"Turks and Caicos Islands", "Marshall Is.":"Marshall Islands",
  "Br. Virgin Is.":"British Virgin Islands", "St. Kitts-Nevis":"St. Kitts and Nevis",
  "U.S. Virgin Is.":"Virgin Islands (U.S.)", "Congo, Dem. Rep.":"Congo, Dem. Rep.",
  "Dem. Rep. Congo":"Congo, Dem. Rep.", "Macedonia":"North Macedonia", "Swaziland":"Eswatini",

/* 取某国在指定年份的指标值（缺失时取最近可得年份；GDP 由 USD 折算 CNY） */
function cMetric(iso2, m, year){
  const o = window.WB && window.WB[iso2]; if(!o || !o.years) return null;   // 无数据返回 null（此前返回 0 会误渲染）
  year = year || dataYear;
  const yk = Object.keys(o.years).map(Number);
  const has = y => o.years[y] && (m==="area" ? o.years[y].area!=null : o.years[y][m]!=null);
  let pick = null;
  if(has(year)) pick = year;
  if(pick==null){
    const b = yk.filter(y=>y<=year && has(y)).sort((a,b)=>b-a)[0];
    const a = yk.filter(y=>y>year && has(y)).sort((a,b)=>a-b)[0];
    pick = (b!=null) ? b : (a!=null ? a : null);
  }
  if(pick==null) return null;
  let v = m==="gdp" ? o.years[pick].gdp : m==="pop" ? o.years[pick].pop : o.years[pick].area;
  if(v==null) return null;

  return v;
}

  if(has(year)) return year;

      const avail=Object.keys(d).map(Number).sort((a,b)=>a-b);
      if(!avail.length) return null;
      let best=avail[0], bd=Math.abs(avail[0]-year);
      for(const y of avail){ const dd=Math.abs(y-year); if(dd<bd){bd=dd;best=y;} }
      return best;
    },
    growth(m,base){
      if(m==="gdp") return cGrowth(iso2,base,"gdpKd");  // 国家用不变价（真实增长）
      if(m==="pop") return cGrowth(iso2,base,"pop");    // 人口增长（WB pop 序列）
      if(m==="area") return cGrowth(iso2,base,"area");  // 面积变化（WB area 序列：测量修订/填海/领土变更）
      // EXT 扩展指标：trade/health/edu/life/gdpcap 较 base 年变化
      const d=window.EXT&&window.EXT[iso2]&&window.EXT[iso2][m];
      if(!d) return null;
      const ks=Object.keys(d).map(Number).sort((a,b)=>a-b);
      const near=yr=>{ if(d[yr]!=null)return yr; const b=ks.filter(y=>y<=yr&&d[y]!=null).pop(); const a=ks.filter(y=>y>yr&&d[y]!=null)[0]; return b!=null?b:(a!=null?a:null); };
      const yb=near(base), ys=near(dataYear);
      if(yb==null||ys==null) return null;
      const vb=d[yb], vs=d[ys];
      if(vb==null) return null;
      if(m==="life") return vs - vb;   // 预期寿命：绝对变化（岁）
      if(vb===0) return null;
      return vs/vb - 1;   // 相对增长率（trade/health/edu/gdpcap）
    },
    gdpSeries(){ const tr=countryTrend(iso2); return tr?{name:o.cn,years:tr.years,values:tr.values}:null; },
    /* 趋势随维度：gdp→WB序列(人民币元)；pop/area→WB 多年；EXT 指标→按年（≥2 点才有趋势） */
    series(m){
      if(m==="gdp"){ const tr=countryTrend(iso2); return tr?{name:o.cn,years:tr.years,values:tr.values}:null; }
      if(m==="pop"||m==="area"){
        const ys=(o.years&&Object.keys(o.years))||[];
        const pairs=ys.map(Number).sort((a,b)=>a-b).map(y=>[y,o.years[y]&&o.years[y][m]]).filter(p=>p[1]!=null);
        return pairs.length>=2?{name:o.cn,years:pairs.map(p=>p[0]),values:pairs.map(p=>p[1])}:null;
      }
      const ed=window.EXT&&window.EXT[iso2]&&window.EXT[iso2][m];
      if(ed&&typeof ed==="object"){
        const yrs=Object.keys(ed).map(Number).sort((a,b)=>a-b);
        if(yrs.length>=2) return {name:o.cn,years:yrs,values:yrs.map(y=>ed[y])};
      }
      return null;
    }
  };
}

function regCity(cm, adcode){
  if(!cm) return null;
  /* 多年序列（Phase E）：CITY_TS[adcode] = {年份: 亿元} */
  const ts = adcode && window.CITY_TS && window.CITY_TS[String(adcode)];
  const ylist = ts ? Object.keys(ts).map(Number).sort((a,b)=>a-b) : [];
  return {
    name:cm.name||"", cn:cm.name||"",
    years:()=>ylist.slice(),   // 无序列城市返回 []
    ext(){ return null; },   // 城市无 World Bank 扩展指标
    get(m, year){
      if(m==="gdp"){
        if(ts){
          if(!year || year==="2023") return cm.gdp;          // 默认/2023 → 单年值（已折算元）
          const y=+year;
          if(ts[y]!=null) return ts[y]*1e8;                  // 序列年 → 亿元×1e8=元
          const near = ylist.length? ylist.reduce((a,b)=>Math.abs(b-y)<Math.abs(a-y)?b:a) : null;
          return near!=null && ts[near]!=null ? ts[near]*1e8 : cm.gdp;
        }
        return cm.gdp;
      }
      return m==="pop"?cm.pop:(m==="area"?cm.area:null);
    },
    growth(m, base){
      if(m!=="gdp" || !ts || ylist.length<2) return null;
      const b=base==null?ylist[0]:+base;
      const lo=ylist[0], hi=ylist[ylist.length-1];
      const bv=ts[b]!=null?ts[b]:(b<lo?ts[lo]:ts[hi]);
      if(bv==null) return null;
      return (ts[hi]-bv)/bv;
    },
    gdpSeries(){ if(!ts) return null;
      return {years:ylist, values:ylist.map(y=>ts[y]*1e8)}; },
    series(m){ return m==="gdp"?this.gdpSeries():null; }   // 城市仅 GDP 序列（city_ts 46 城）
  };
}

/* E1: 按层懒加载脚本（避免首屏 7MB 同步阻塞；重复调用只加载一次） */
const __scripts={};
function loadScript(src){
  return new Promise((res,rej)=>{
    if(__scripts[src]){ res(); return; }
    const s=document.createElement("script");
    s.src=src; s.onload=()=>{ __scripts[src]=1; res(); }; s.onerror=()=>rej(new Error("加载失败: "+src));
    document.head.appendChild(s);
  });
}
function loadCnProvGeo(adcode){
  return new Promise((resolve,reject)=>{
    if(window.CN_PROV && window.CN_PROV[adcode]){ resolve(window.CN_PROV[adcode]); return; }
    const s=document.createElement("script");
    s.src=`vendor/cn/${adcode}.js`;
    s.onload=()=>{ const g=window.CN_PROV && window.CN_PROV[adcode]; g?resolve(g):reject(new Error("边界未注册 "+adcode)); };
    s.onerror=()=>reject(new Error("加载边界失败 "+adcode));
    document.head.appendChild(s);
  });
}

  if(metricScope(metric)==="world"){ showGeneric("日本 · 都道府县","", metricUnavailableMsg(metric)); renderRank(); return; }   // 守卫在前：不改变 currentLevel（S2 修复）
  /* 状态残留清理：进入日本县层时清空省级/欧盟状态 */
  currentProvName=""; currentProvAdcode=""; currentProvData=[]; currentNUTS="";
  if(!window.JP_GEO){ try{ await loadScript("vendor/japan.js"); }catch(e){} }   // 懒加载（E1）
  currentLevel="japan";
  const gj = window.JP_GEO; if(!gj){ showGeneric("日本","都道府县边界未加载","vendor/japan.js 缺失"); return; }
  echarts.registerMap("japan", gj);
  const data = gj.features.map(f=>{
    const nm=f.properties.name;
    return {name:nm, value:regGet(regJapanPref(nm),metric,dataYear)||0, reg:regJapanPref(nm)};
  });
  const vals=data.map(d=>d.value).filter(v=>v>0);
  const min=vals.length?Math.min(...vals):0, max=vals.length?Math.max(...vals):0;
  chart.clear();
  chart.setOption({
    backgroundColor:"#05060a",
    tooltip:{trigger:"item", formatter:p=>{ const r=p.data&&p.data.reg;
      if(!r) return `<b>${p.name}</b><br/><span style="color:#7f93a8">暂无细分指标</span>`;
      return `<b>${p.name}</b> · 2021<br/>GDP ${fmtGDP(regGet(r,"gdp",dataYear))}<br/>人口 ${fmtPop(regGet(r,"pop",dataYear))}<br/>面积 ${fmtArea(regGet(r,"area",dataYear))}`;}},
    visualMap:vals.length?{min,max,left:20,bottom:30,calculable:true,title:metricLabel(metric)+" · 2021",inRange:{color:["#0a3a4a","#00F0FF","#FF2E93"]},
      textStyle:{color:"#9fb3c8"},text:["高","低"],formatter:v=>metricFmt(metric,v)}:{show:false},
    series:[{type:"map",map:"japan",roam:false,data,label:{show:false},
      emphasis:{label:{show:true,color:"#fff"},itemStyle:{areaColor:"#FF2E93"}}}]
  });
  setCrumbPath([{label:"世界", level:"world"},{label:"日本", level:"japan"}]);
  showGeneric("日本 · 都道府县", "共 47 县；单击县查看三项指标",
    `日本 47 都道府县：GDP 为 2021 年度県民経済計算（名义，按 1日元≈0.05元近似折算、非当年平均汇率）；人口为 2023 估计、面积为总面积。县级数据为单年快照（无多年序列），年份切换不生效。`);
  document.getElementById("trend").innerHTML="";   // 县级无多年序列
  renderRank();
}

      {label:"GDP (2021)", value:fmtGDP(regGet(r,"gdp",dataYear))},
      {label:"人口 (2023)", value:fmtPop(regGet(r,"pop",dataYear))},
      {label:"面积", value:fmtArea(regGet(r,"area",dataYear))}

}
function showUSStatePanel(nm){
  lastShown={type:"usstate", nm};
  const s=US_STATES_GDP[nm]; if(!s) return;
  const gy=usGdpYear(nm,dataYear), yg=usGdpY(nm,dataYear), ng=usNominalGrowth(nm,2000);
  const popY=(s.popYear||2023);
  const delta=(v,fmt)=>v==null?null:{txt:fmt(v),dir:v>=0?"up":"down"};
  const baseStats=[
      {label:"GDP ("+gy+")", value:fmtGDP(yg!=null?yg:s.gdp), delta:delta(ng,fmtGrowth)},
      {label:"人口 ("+popY+")", value:fmtPop(s.pop)},
      {label:"面积", value:fmtArea(s.area)}
    ];
  const baseInsight=[{label:"较2000年 名义增长(现价)", value:ng!=null?fmtGrowth(ng):"—", cls:ng!=null?(ng>=0?"pos":"neg"):""}];
  const cards=metricCards(baseStats, baseInsight,
    metric==="pop"?{label:"人口 ("+popY+")", value:fmtPop(s.pop)}:metric==="area"?{label:"面积", value:fmtArea(s.area)}:null);
  renderDashboard({
    name:nm, en:"United States · 州", level:"美国州",
    tags:[`来源：BEA + Census`,`GDP ${gy} · 人口 ${popY}`],
    stats:cards.stats, insight:cards.insight,
    trendHTML:null,
    actionsHTML:`<button class="btn" onclick="cmpHandleClick('usstate','${nm}','${nm}')">＋ 加入对比</button>`
  });
  const tr=usTrend(nm);
  if(tr && metric==="gdp"){ document.getElementById("trend").innerHTML=`<div class="rank-title">${nm} · GDP 趋势</div><div id="trendChart" style="height:150px;width:100%;"></div>`;
    renderTrendChart([{name:nm, years:tr.years, values:tr.values}], fmtGDP); }   // M1: 仅 GDP 维度渲染趋势
  else document.getElementById("trend").innerHTML="";
}
function showProvincePanel(short){
  lastShown={type:"prov", short};
  const m=CN[short]; if(!m){ showGeneric(short, "省级数据未收录", "该地区未纳入维基省级序列（GDP/人口/面积暂无）。双击可进入下一级视图。"); return; }   // L2: 港澳单击给出提示
  const o = window.CN_TS && window.CN_TS[short];
  const gd = cnGdpRMB(short, dataYear);
  const gdY = cnGdpYear(short, dataYear);   // 实际采用的年份（稀疏年份诚实标注）
  const pop = (o && o.pop && o.pop["2023"]) ? o.pop["2023"] : m.pop*1e4;
  const area = (o && o.area!=null) ? o.area : m.area;
  const g25 = (o && o.gdpRMB && o.gdpRMB["2025"]!=null) ? o.gdpRMB["2025"] : null;
  const rg25 = (o && o.rg25!=null) ? o.rg25 : null;
  const ng = cnNominalGrowth(short, 2000);
  const baseStats=[{label:"GDP ("+gdY+(gdY!==dataYear?" 回退":"")+")", value:fmtGDP(gd!=null?gd:0)}];
  if(g25!=null && dataYear!=="2025") baseStats.push({label:"GDP (2025 初核)", value:fmtGDP(g25)});
  baseStats.push({label:"人口 (2023)", value:fmtPop(pop)});
  baseStats.push({label:"面积", value:fmtArea(area)});
  const baseInsight=[];
  if(ng!=null && dataYear!=="2000") baseInsight.push({label:"较2000年 名义增长", value:fmtGrowth(ng), cls:ng>=0?"pos":"neg"});
  if(rg25!=null) baseInsight.push({label:"2025 实际增幅", value:(rg25*100).toFixed(1)+"%", cls:rg25>=0?"pos":"neg"});
  const cards=metricCards(baseStats, baseInsight,
    metric==="pop"?{label:"人口 (2023)", value:fmtPop(pop)}:metric==="area"?{label:"面积", value:fmtArea(area)}:null);
  renderDashboard({
    name:short, en:"中国省份 · "+gdY, level:"省级",   // L5: 标题用实际可得年份（回退诚实标注）
    tags:["来源：维基百科整理（官方公报/五经普修订）",`年份 ${gdY}`],
    stats:cards.stats, insight:cards.insight,
    trendHTML:null,
    actionsHTML:`<button class="btn" onclick="cmpHandleClick('prov','${short}','${short}')">＋ 加入对比</button>`
  });
  const tr=provTrend(short);
  if(tr && metric==="gdp"){ document.getElementById("trend").innerHTML=`<div class="rank-title">${short} · GDP 趋势</div><div id="trendChart" style="height:150px;width:100%;"></div>`;
    renderTrendChart([{name:short, years:tr.years, values:tr.values}], fmtGDP); }   // M1: 仅 GDP 维度渲染趋势（人口/面积无序列）
  else document.getElementById("trend").innerHTML="";
}

/* ============== 欧盟 NUTS2 省级（Phase E 试点 8 国） ============== */
let currentNUTS="";   // 当前下钻的欧盟国家代码
/* DRILLABLE 注册表：国家 ISO2 → 下钻加载函数（泛化下钻，替代硬编码 CN/US/JP 判断） */
const DRILLABLE = {
  CN: { load: ()=>loadChina(),  label: "中国" },
  US: { load: ()=>loadUS(),     label: "美国" },
  JP: { load: ()=>loadJapan(),  label: "日本" },
  DE: { load: ()=>loadNUTS("DE"), label: "德国" },
  FR: { load: ()=>loadNUTS("FR"), label: "法国" },
  IT: { load: ()=>loadNUTS("IT"), label: "意大利" },
  ES: { load: ()=>loadNUTS("ES"), label: "西班牙" },
  NL: { load: ()=>loadNUTS("NL"), label: "荷兰" },
  PL: { load: ()=>loadNUTS("PL"), label: "波兰" },
  BE: { load: ()=>loadNUTS("BE"), label: "比利时" },
  AT: { load: ()=>loadNUTS("AT"), label: "奥地利" }
};
function euCCName(cc){ const d=DRILLABLE[cc]; return d?d.label:cc; }
/* ============== LAYERS 层级注册表（架构重构） ==============
   所有层级行为收敛为一份配置：render(重绘) / click(单击面板) / drill(双击下钻) /
   rank(排行 items) / restore(切指标/年份后恢复面板) / back(返回上级)。
   加新层只需注册 1 条 + 写 1 个 render 函数，不再改散落的 if-else。 */
const LAYERS = {
  world: {
    label:"世界", back:"world",
    render:()=>renderWorld2D(),
    click(p){ const c=p.data&&p.data.cn; if(c) showCountry(c); },   // 所有国家（含 CN/US/JP/EU）单击都显示面板
    drill(p){ const c=p.data&&p.data.cn; if(!c) return;
      const d=DRILLABLE[c[2]];
      if(d) d.load();
      else showGeneric(c[0]+" · 国家","暂无下钻数据","该国家未提供省级行政区划下钻（当前支持 中国/美国/日本/欧盟8国）。单击查看国家详情，或返回世界选择其他区域。"); },
    rank:()=>COUNTRIES.map(c=>{ const r=regCountry(c[2]); return [c[0],c[1],r?regGet(r,metric,dataYear):null,"country"]; }).filter(it=>it[2]!=null).sort((a,b)=>b[2]-a[2]),
    restore(){ if(lastShown&&lastShown.type==="country") showCountry(lastShown.data); }
  },
  china: {
    label:"中国", back:"world",
    render:()=>loadChina(),
    click(p){ const nm=normProv(p.name); if(PROV_ADCODE[nm]) showProvincePanel(nm); },
    drill(p){ const nm=normProv(p.name); const adcode=PROV_ADCODE[nm]; if(adcode) loadProvince(nm, adcode); },
    rank:()=>{ const MUNI=["上海","北京","天津","重庆"];   // 直辖市不加"省"
      return Object.keys(CN).map(k=>{ const r=regProv(k), v=regGet(r,metric,dataYear); return [MUNI.includes(k)?k:k+"省",k,v,"prov"]; })
        .filter(it=>it[2]!=null).sort((a,b)=>b[2]-a[2]); },
    restore(){ if(lastShown&&lastShown.type==="prov") showProvincePanel(lastShown.short); }
  },
  province: {
    label:"省级", back:"china",
    render:()=>{ if(currentProvName&&currentProvAdcode) loadProvince(currentProvName, currentProvAdcode); else loadChina(); },   // 无省级上下文时回退中国层（与旧分支一致）
    click(p){ const d=p.data; if(d&&d.cm) showCityPanel(d.name, d.adcode, d.parentAdcode); },
    drill:null,
    rank:()=>currentProvData.filter(d=>d.cm)
      .map(d=>{ const cm=d.cm; const r=regCity(cm, d.adcode); const v=regGet(r,metric,dataYear); return [d.name, d.name, v, "city", d.adcode, d.parentAdcode]; })
      .filter(it=>it[2]!=null).sort((a,b)=>b[2]-a[2]),   // L1: null 过滤（与其余分支一致）
    restore(){ if(lastShown&&lastShown.type==="city") showCityPanel(lastShown.name, lastShown.adcode, lastShown.pa); }
  },
  us: {
    label:"美国", back:"world",
    render:()=>loadUS(),
    click(p){ showUSStatePanel(p.name); },
    drill:null,
    rank:()=>Object.keys(US_STATES_GDP).map(k=>{ const r=regUSState(k); return [k,k,regGet(r,metric,dataYear),"usstate"]; })
      .filter(it=>it[2]!=null).sort((a,b)=>b[2]-a[2]),
    restore(){ if(lastShown&&lastShown.type==="usstate") showUSStatePanel(lastShown.nm); }
  },
  japan: {
    label:"日本", back:"world",
    render:()=>loadJapan(),
    click(p){ showJapanPrefPanel(p.name); },
    drill:null,
    rank:()=>Object.keys(window.JP_METRICS||{}).map(k=>{ const r=regJapanPref(k); return [k,k,regGet(r,metric,dataYear),"jppref"]; })
      .filter(it=>it[2]!=null).sort((a,b)=>b[2]-a[2]),
    restore(){ if(lastShown&&lastShown.type==="jppref") showJapanPrefPanel(lastShown.nm); }
  },
  nuts: {
    label:"欧盟", back:"world",
    render:()=>loadNUTS(currentNUTS||"DE"),
    click(p){ const d=p.data; if(d&&d.nid) showNUTSPanel(d.nid); },
    drill:null,
    rank:()=>Object.keys(window.EU_METRICS||{}).filter(k=>(window.EU_METRICS[k]||{}).cc===currentNUTS)
      .map(k=>{ const r=regNUTS(k); const v=r?regGet(r,metric,dataYear):null; return [r?r.name:k,k,v,"nutspref"]; })
      .filter(it=>it[2]!=null).sort((a,b)=>b[2]-a[2]),   // NUTS2 排行（当前国家）
    restore(){ if(lastShown&&lastShown.type==="nutspref") showNUTSPanel(lastShown.nm); }
  }
};
function layerGet(){ return LAYERS[currentLevel]||null; }
/* ============== URL 状态持久化（优化3）：hash 保存/恢复 层级·指标·年份·面板·对比 ==============
   用 history.replaceState 避免历史堆积；saveState 在层级/指标/年份/对比/面板变化时调用，
   restoreState 在 load 时恢复（无 hash 或无效则返回 false 走默认世界视图）。 */
function saveState(){
  try{
    const s={level:currentLevel, metric, year:dataYear};
    if(lastShown){
      const ls=lastShown;
      if(ls.type==="country"&&ls.data) s.sel="country:"+ls.data[2];
      else if(ls.type==="prov"&&ls.short) s.sel="prov:"+ls.short;
      else if(ls.type==="usstate"&&ls.nm) s.sel="usstate:"+ls.nm;
      else if(ls.type==="jppref"&&ls.nm) s.sel="jppref:"+ls.nm;
      else if(ls.type==="nutspref"&&ls.nm) s.sel="nutspref:"+ls.nm;
    }
    if(cmpList.length) s.cmp=cmpList.map(it=>it.t+":"+it.k).join(",");
    const target="#"+new URLSearchParams(s).toString();
    if(location.hash!==target) history.replaceState(null,"",target);
  }catch(e){ /* hash 保存失败不影响功能 */ }
}
async function restoreState(){
  const h=location.hash.slice(1); if(!h) return false;
  const p=new URLSearchParams(h);
  const lvl=p.get("level"), m=p.get("metric"), yr=p.get("year");
  if(m&&METRICS[m]){ metric=m; const seg=document.getElementById("metricSeg"); if(seg)[...seg.children].forEach(b=>b.classList.toggle("active",b.dataset.m===m)); }
  if(yr&&!isNaN(+yr)) dataYear=yr;
  if(!(lvl&&LAYERS[lvl])) return false;
  try{ await LAYERS[lvl].render(); }catch(e){ return false; }
  // 恢复面板区域（lastShown 语义，供切指标/年份时跟随刷新）
  const sel=p.get("sel");
  if(sel){
    const i=sel.indexOf(":"); const t=sel.slice(0,i), k=sel.slice(i+1);
    if(t==="country"){ const c=COUNTRIES.find(x=>x[2]===k)||BY_EN[k]; if(c) showCountry(c); }
    else if(t==="prov"){ const pk=Object.keys(CN).find(x=>x===k); if(pk) showProvincePanel(pk); }
    else if(t==="usstate"){ if(US_STATES_GDP[k]) showUSStatePanel(k); }
    else if(t==="jppref"){ if(window.JP_METRICS&&JP_METRICS[k]) showJapanPrefPanel(k); }
    else if(t==="nutspref"){ if(window.EU_METRICS&&EU_METRICS[k]) showNUTSPanel(k); }
  }
  // 恢复对比列表
  const cmp=p.get("cmp");
  if(cmp){ cmpList=[]; cmp.split(",").forEach(c=>{ const i=c.indexOf(":"); if(i>0){ const t=c.slice(0,i), k=c.slice(i+1); cmpList.push({t,k,name:k}); } }); if(cmpList.length){ cmpMode=true; updateCompare(); } }
  return true;
}
/* regNUTS：NUTS2 区域 reg 接口（单年快照 2023，与日本一致） */
function regNUTS(nid){
  const d=window.EU_METRICS&&window.EU_METRICS[nid]; if(!d) return null;
  return {
    name:d.name, cn:d.name, cc:d.cc,
    years:()=>[d.year],   // 单年快照
    ext(){ return null; },
    get(m){ return m==="gdp"?d.gdp:m==="pop"?d.pop:(m==="area"?d.area:null); },
    growth(){ return null; }, gdpSeries(){ return null; }, series(){ return null; }
  };
}
async function loadNUTS(cc){
  if(metricScope(metric)==="world"){ showGeneric(euCCName(cc)+" · NUTS2","", metricUnavailableMsg(metric)); renderRank(); return; }   // 守卫在前：不改变 currentLevel
  /* 状态残留清理：进入欧盟 NUTS2 层时清空省级状态（currentNUTS 由本函数设置） */
  currentProvName=""; currentProvAdcode=""; currentProvData=[];
  if(!window["EU_"+cc+"_GEO"]){ try{ await loadScript("vendor/eu/"+cc.toLowerCase()+".js"); }catch(e){} }   // 懒加载边界（E1）
  if(!window.EU_METRICS){ try{ await loadScript("vendor/eu/eu_metrics.js"); }catch(e){} }   // 懒加载指标
  currentLevel="nuts"; currentNUTS=cc;
  const gj=window["EU_"+cc+"_GEO"]; if(!gj){ showGeneric(euCCName(cc),"边界未加载","vendor/eu/"+cc.toLowerCase()+".js 缺失"); return; }
  echarts.registerMap("nuts-"+cc, gj);
  const data=gj.features.map(f=>{
    const nid=f.properties.NUTS_ID;
    const r=regNUTS(nid);
    return {name:f.properties.NUTS_NAME, value:r?regGet(r,metric,dataYear)||0:0, reg:r, nid};
  });
  const vals=data.map(d=>d.value).filter(v=>v>0);
  const min=vals.length?Math.min(...vals):0, max=vals.length?Math.max(...vals):0;
  chart.clear();
  chart.setOption({
    backgroundColor:"#05060a",
    tooltip:{trigger:"item", formatter:p=>{ const r=p.data&&p.data.reg;
      if(!r) return `<b>${p.name}</b><br/><span style="color:#7f93a8">暂无指标数据</span>`;
      return `<b>${p.name}</b> · ${r.years()[0]}<br/>GDP ${fmtGDP(r.get("gdp"))}<br/>人口 ${fmtPop(r.get("pop"))}<br/>面积 ${fmtArea(r.get("area"))}`;}},
    visualMap:vals.length?{min,max,left:20,bottom:30,calculable:true,title:metricLabel(metric)+" · 2023",inRange:{color:["#0a3a4a","#00F0FF","#FF2E93"]},
      textStyle:{color:"#9fb3c8"},text:["高","低"],formatter:v=>metricFmt(metric,v)}:{show:false},
    series:[{type:"map",map:"nuts-"+cc,roam:false,data,label:{show:false},
      emphasis:{label:{show:true,color:"#fff"},itemStyle:{areaColor:"#FF2E93"}}}]
  });
  setCrumbPath([{label:"世界", level:"world"},{label:euCCName(cc), level:"nuts"}]);
  showGeneric(euCCName(cc)+" · NUTS2 省级","共 "+gj.features.length+" 个大区；单击查看数据",
    `欧盟 ${euCCName(cc)} NUTS2 省级（Eurostat ${(window.EU_RATE||"")?"2023":""} 单年快照）：GDP 现价欧元按 EUR/CNY ${window.EU_RATE||"—"} 折算人民币。人口/面积同源单年。年份切换不生效。`);
  document.getElementById("trend").innerHTML="";
  renderRank();
}
function showNUTSPanel(nid){
  lastShown={type:"nutspref", nm:nid};
  const r=regNUTS(nid); if(!r) return;
  const cards=metricCards([
      {label:"GDP (2023)", value:fmtGDP(r.get("gdp"))},
      {label:"人口 (2023)", value:fmtPop(r.get("pop"))},
      {label:"面积", value:fmtArea(r.get("area"))}
    ], [],
    metric==="pop"?{label:"人口 (2023)", value:fmtPop(r.get("pop"))}:metric==="area"?{label:"面积", value:fmtArea(r.get("area"))}:null);
  renderDashboard({
    name:r.name, en:euCCName(r.cc)+" · NUTS2", level:"欧盟省级",
    tags:["来源：Eurostat","GDP 2023 · 欧元折算人民币"],
    stats:cards.stats, insight:cards.insight,
    actionsHTML:`<button class="btn" onclick="cmpHandleClick('nutspref','${r.name.replace(/'/g,"")}','${nid}')">＋ 加入对比</button>`
  });
  document.getElementById("trend").innerHTML="";
}

/* ============== 排行榜 + 搜索 ============== */
function renderRank(){
  const box=document.getElementById("rank");
  let items=[], unit=metricLabel(metric);
  const L=layerGet();
  if(L&&L.rank){ items=L.rank(); }
  else { box.innerHTML=""; return; }
  if(!items.length){ box.innerHTML=""; return; }
  const fmt=v=> metricFmt(metric,v);
  box.innerHTML=`<div class="rank-title">${esc(unit)} · 排行 · ${dataYear}（全量，可滚动）</div>`+items.map((it,i)=>
    `<div class="rank-item" data-type="${it[3]}" data-key="${esc(it[1])}" tabindex="0" role="button" aria-label="${esc(it[0])} ${esc(fmt(it[2]))}">
       <span class="rk">${i+1}</span><span class="rn">${esc(it[0])}</span><span class="rv">${esc(fmt(it[2]))}</span></div>`).join("");
  box.querySelectorAll(".rank-item").forEach(el=>{
    el.onclick=()=>{
      const t=el.dataset.type, k=el.dataset.key;
      if(t==="country"){ const c=BY_EN[k]; if(!c)return; const d=DRILLABLE[c[2]]; if(d) d.load(); else showCountry(c); }   // 泛化下钻
      else if(t==="prov"){ if(currentLevel!=="china") loadChina(); setTimeout(()=>showProvincePanel(k), currentLevel==="china"?0:700); }
      else if(t==="city"){ showCityPanel(it[0], it[4], it[5]); }
      else if(t==="usstate"){ if(currentLevel!=="us"){ loadUS(); setTimeout(()=>showUSStatePanel(k),80); } else showUSStatePanel(k); }
      else if(t==="jppref"){ if(currentLevel!=="japan"){ loadJapan(); setTimeout(()=>showJapanPrefPanel(k),80); } else showJapanPrefPanel(k); }
      else if(t==="nutspref"){ if(currentLevel!=="nuts"){ loadNUTS(currentNUTS||"DE"); setTimeout(()=>showNUTSPanel(k),80); } else showNUTSPanel(k); }
    };
    el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); el.onclick(); } });   // P1b: 键盘可操作排行
  });
}
function doSearch(q){
  q=(q||"").trim().toLowerCase(); if(!q) return;
  const c=COUNTRIES.find(x=>x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));
  if(c){
    const d=DRILLABLE[c[2]];
    if(d) d.load();   // 泛化下钻
    else { renderWorld2D(); showCountry(c); }   // M4: 第三国先回世界层再显示面板，避免层级错位
    return;
  }
  const pk=Object.keys(CN).find(k=>k.toLowerCase().includes(q)||normProv(k).toLowerCase().includes(q));
  if(pk){ (currentLevel==="china"?Promise.resolve():loadChina()).then(()=>showProvincePanel(pk)); return; }   // L7: 等 loadChina 完成再显示省面板，避免竞态
  if(window.US_GEO){
    const sk=Object.keys(US_STATES_GDP).find(k=>k.toLowerCase().includes(q));
    if(sk){ if(currentLevel!=="us") loadUS(); setTimeout(()=>showUSStatePanel(sk), currentLevel==="us"?0:700); return; }
  }
  /* 城市搜索（L5）：CITY_INDEX 离线索引 [城市名, 市adcode, 省adcode, 省名] */
  if(window.CITY_INDEX){
    const qq = q.replace(/(市|地区|自治州|盟)$/, "");
    const hit = window.CITY_INDEX.find(x => x[0].includes(q) || x[0].replace(/(市|地区|自治州|盟)$/,"").includes(qq) || qq.includes(x[0].replace(/(市|地区|自治州|盟)$/,"")));
    if(hit){
      const [cname, cadcode, padcode, pname] = hit;
      loadProvince(pname, padcode).then(()=>showCityPanel(cname, cadcode, padcode));
      return;
    }
  }
  showBanner("未找到匹配：「"+q+"」");
}

/* ============== 对比模式（Phase D 补齐） ============== */
let cmpMode=false, cmpList=[];   // cmpMode=对比列表是否展示（不改变单击行为）；cmpList: [{t,name,k,pa}]
let lastShown=null;   // 当前面板显示的区域（切维度时恢复并跟随刷新）
function cmpGetData(it){
  const y=dataYear;
  let base={};
  if(it.t==="country"){ base={g:cMetric(it.k,"gdp",y), p:cMetric(it.k,"pop",y), a:cMetric(it.k,"area",y)}; }
  else if(it.t==="prov"){ const g=cnGdpRMB(it.k,y), o=window.CN_TS&&window.CN_TS[it.k];
    base={g, p:(o&&o.pop&&o.pop["2023"])?o.pop["2023"]:null, a:(o&&o.area)||null}; }
  else if(it.t==="usstate"){ base={g:usGdpY(it.k,y), p:(US_STATES_GDP[it.k]||{}).pop, a:(US_STATES_GDP[it.k]||{}).area}; }
  else if(it.t==="jppref"){ const d=window.JP_METRICS&&window.JP_METRICS[it.k]; if(!d) return null;
    base={g:d.gdp, p:d.pop, a:d.area}; }
  else if(it.t==="nutspref"){ const d=window.EU_METRICS&&window.EU_METRICS[it.k]; if(!d) return null;
    base={g:d.gdp, p:d.pop, a:d.area}; }
  else if(it.t==="city"){ const cm=getCityMetric(it.k, it.pa); if(!cm) return null;
    base={g:cm.gdp, p:cm.pop, a:cm.area}; }   // 数据已由 city_metrics.js 折算为元/人（L5: 传 parentAdcode 支持直辖市兜底）
  else return null;
  // 当前维度值：gdp/pop/area 用对应值；EXT 系指标（trade/health/edu/life/gdpcap）仅国家层有
  if(metric==="gdp") base.v=base.g;
  else if(metric==="pop") base.v=base.p;
  else if(metric==="area") base.v=base.a;
  else base.v = (it.t==="country"&&window.EXT&&window.EXT[it.k]&&window.EXT[it.k][metric]) ? (function(){const d=window.EXT[it.k][metric],yy=String(y);if(d[yy]!=null)return d[yy];const ks=Object.keys(d).map(Number).sort((a,b)=>a-b);if(!ks.length)return null;let best=ks[0],bd=Math.abs(ks[0]-y);for(const k of ks){const dd=Math.abs(k-y);if(dd<bd){bd=dd;best=k;}}return d[String(best)];})() : null;   // L6: 与 reg.ext 同口径（最近年份）
  return base;
}
function cmpToggle(it){
  const i=cmpList.findIndex(x=>x.t===it.t&&x.k===it.k);
  if(i>=0) cmpList.splice(i,1); else cmpList.push(it);
  if(cmpList.length) cmpMode=true; else cmpMode=false;   // 有对比项自动展示列表
  updateCompare();
  saveState();   // 优化3：对比变化保存 URL 状态
}
/* 统一对比刷新：展示列表 + ≥2 项自动渲染对比图（跟随维度）；<2 项清空对比图 */
function updateCompare(){
  cmpRender();
  if(cmpList.length>=2) renderTrendCompare(cmpList.map(it=>{const d=cmpGetData(it); return {name:it.name, val:d&&d.v!=null?d.v:0};}), "对比 · "+metricLabel(metric), v=>metricFmt(metric,v));
  else document.getElementById("trend").innerHTML="";
}
function cmpRender(){
  const box=document.getElementById("compareBox"); if(!box) return;
  box.style.display = (cmpList.length && cmpMode) ? "block" : "none";   // 有对比项才显示，cmpMode 控制显隐
  if(!cmpList.length || !cmpMode) return;
  const rows=cmpList.map(it=>{
    const d=cmpGetData(it);
    const v=d&&d.v!=null?metricFmt(metric,d.v):"—";      // 当前维度值（跟随切换）
    const g=d&&d.g!=null?fmtGDP(d.g):"—", p=d&&d.p!=null?fmtPop(d.p):"—", a=d&&d.a!=null?fmtArea(d.a):"—";
    return `<div style="padding:4px 0;border-bottom:1px solid #0e2233;font-size:12px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="cmp-del" data-k="${it.t}:${it.k}" style="background:transparent;border:1px solid var(--line);color:var(--pink);border-radius:4px;width:18px;height:18px;line-height:14px;cursor:pointer;font-size:10px;">×</button>
        <span style="flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${it.name}</span>
        <span style="color:var(--cyan);font-weight:600;font-size:12px;">${v}</span>
      </div>
      <div style="padding-left:24px;color:#9fb3c8;font-size:11px;margin-top:1px;">${g} · ${p} · ${a}</div></div>`;
  }).join("");
  // 对比列跟随当前维度（L6 修复）：标题标注当前指标
  box.innerHTML=`<div class="rank-title">对比 · ${metricLabel(metric)}<span style="float:right;color:var(--pink);cursor:pointer;" onclick="cmpClear()">清空</span></div>${rows}`;
  box.querySelectorAll(".cmp-del").forEach(el=>{
    el.onclick=()=>{ const [t,k]=el.dataset.k.split(":"); cmpToggle({t,k,name:""}); };
  });
}
function cmpClear(){ cmpList=[]; cmpMode=false; updateCompare(); document.getElementById("trend").innerHTML=""; saveState(); }   // 优化3：对比清空保存 URL 状态
function cmpHandleClick(type, name, key, pa){
  cmpToggle({t:type, name, k:key, pa});
  return true;
}

/* ============== 交互 ============== */
/* 交互：单击显示内容（260ms 防抖，避免双击误触发），双击下钻 */
let clickTimer=null;
function onChartClick(p){
  if(clickTimer){ clearTimeout(clickTimer); clickTimer=null; }
  clickTimer=setTimeout(()=>{ clickTimer=null; showContentFor(p); }, 260);
}
function onChartDblClick(p){
  if(clickTimer){ clearTimeout(clickTimer); clickTimer=null; }
  drillDownFor(p);
}
/* 单击：显示该区域内容（不下钻）——统一走 LAYERS 注册表 */
function showContentFor(p){
  ensurePanelOpen();   /* 单击区域：自动展开面板看数据 */
  const L=layerGet(); if(L&&L.click) L.click(p);
}
/* 双击：下钻（仅可下钻层级）——统一走 LAYERS 注册表 */
function drillDownFor(p){
  ensurePanelOpen();   /* 下钻：自动展开面板 */
  const L=layerGet(); if(L&&L.drill) L.drill(p);
}

/* ============== 启动 ============== */
window.addEventListener("load", ()=>{
  if(typeof echarts==="undefined"){
    document.getElementById("fatal").style.display="flex";
    document.getElementById("fatal").textContent="echarts 未能加载（vendor/echarts.min.js 缺失或被拦截）。";
    return;
  }
  chart = echarts.init(document.getElementById("chart"));
  chart.on("click", onChartClick);
  chart.on("dblclick", onChartDblClick);   // 双击下钻（单击已防抖 260ms）

  /* 面板折叠：世界层自动折叠成悬浮按钮；点击区域自动展开 */
  document.getElementById("panelFold").addEventListener("click", ()=>togglePanel());
  document.getElementById("panelFloat").addEventListener("click", ()=>togglePanel(false));

  /* 指标按钮由 METRICS 注册表动态生成：加新维度只需在 METRICS 注册，按钮自动出现 */
  (function(){
    const seg=document.getElementById("metricSeg");
    let first=true;
    Object.keys(METRICS).forEach(m=>{
      const b=document.createElement("button");
      b.dataset.m=m; b.className=first?"active":""; b.textContent=METRICS[m].label;
      seg.appendChild(b); first=false;
    });
  })();

  const gj = window.WORLD_GEO;
  if(gj){ worldGeo=gj; echarts.registerMap("world", gj); }
  else { showBanner("警告：world.js 未加载，世界地图不可用"); }
  restoreState().then(ok=>{ if(!ok){ renderWorld2D(); renderRank(); } });   // 优化3：有 URL 状态则恢复视图（层级/指标/年份/面板/对比），否则默认世界

  document.getElementById("metricSeg").addEventListener("click", async e=>{
    const b=e.target.closest("button"); if(!b)return;
    if(b.disabled) return;   // 当前层级不可用的指标不可点击
    const m=b.dataset.m;
    // E2: EXT 扩展指标（scope=world）按需加载 ext_indicators.js（首屏省 669KB）
    if(metricScope(m)==="world" && !window.EXT){ try{ await loadScript("vendor/ext_indicators.js"); }catch(e){ showBanner("扩展指标数据加载失败"); return; } }
    metric=m; [...e.currentTarget.children].forEach(x=>x.classList.toggle("active",x===b));
    const L=layerGet(); if(L){ L.render(); L.restore(); }   // 切维度：重绘当前层 + 恢复面板区域并跟随刷新（统一走 LAYERS）
    renderRank();
    updateCompare();   // 维度切换：对比值/图跟随刷新
    saveState();   // 优化3：指标变化保存 URL 状态
  });
  /* 年份选择器 (C) — 多年度由 World Bank(2000-2024) 驱动 */
  (function(){
    const sel=document.getElementById("yearSel");
    if(window.WB){
      const yrs=new Set();
      Object.values(window.WB).forEach(o=>Object.keys(o.years).forEach(y=>yrs.add(+y)));
      const arr=[...yrs].sort((a,b)=>b-a);
      if(!arr.includes(2025)) arr.unshift(2025);   // 省级有 2025 初核，纳入下拉使选择器成为唯一年份来源（国家/州缺 2025 时按最近年回退）
      sel.innerHTML=arr.map(y=>"<option value=\""+y+"\""+(String(y)==="2025"?" selected":"")+">"+y+"</option>").join("");
      dataYear="2025";   // 默认最新年份（省 2025 初核；国家/州按最近年回退并诚实标注）
    }
  })();
  /* 按当前 dataYear 重绘当前层（年份下拉/播放动画共用） */
  function redrawByYear(){
    const L=layerGet(); if(L){ L.render(); L.restore(); }   // 切年份：重绘当前层 + 恢复面板区域（统一走 LAYERS）
    renderRank();
  }
  document.getElementById("yearSel").addEventListener("change", e=>{
    dataYear = e.target.value;
    redrawByYear();
    saveState();   // 优化3：年份变化保存 URL 状态
  });
  document.getElementById("backBtn").addEventListener("click", ()=>{
    // 统一返回逻辑（L6/I2）：逐级返回 + 面包屑一致（走 LAYERS.back）
    const L=layerGet();
    if(L) goLevel(L.back);
    else goLevel("world");
  });
  /* ESC 键返回上一级 */
  window.addEventListener("keydown", e=>{ if(e.key==="Escape" && !(e.target&&e.target.tagName==="INPUT")){ document.getElementById("backBtn").click(); } });   // L4: 搜索框聚焦时 ESC 不触发返回
  const searchEl=document.getElementById("search");
  searchEl.addEventListener("keydown", e=>{ if(e.key==="Enter") doSearch(e.target.value); });
  searchEl.addEventListener("blur", e=>{ /* 不搜索：避免点击地图/排行时误触发跳转（M10 修复） */ });
  document.getElementById("cmpBtn").addEventListener("click", ()=>{
    cmpMode=!cmpMode;
    document.getElementById("cmpBtn").classList.toggle("active", cmpMode);
    cmpRender();   // 仅切换对比列表显隐，不改变地图单击行为
  });
  window.addEventListener("resize", ()=>chart && chart.resize());
});
</script>
