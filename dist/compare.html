<script>
/* ============== 独立对比页（compare.html） ==============
   复用 app-core.js（METRICS/reg/cmpGetData/格式化）；本页仅对比 UI 与图表。 */
let cmpList = [];        // [{t,name,k,pa}]
let metric = "gdp";
let dataYear = "2023";

/* ---------- 按需加载（EXT / EU） ---------- */
let __euPromise=null, __extPromise=null;
function loadScript(raw){
  const src=(window.VHASH&&window.VHASH[raw])?raw+"?v="+window.VHASH[raw]:raw;
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=src; s.onload=()=>res(); s.onerror=()=>rej(new Error("加载失败: "+src));
    document.head.appendChild(s);
  });
}
function ensureEXT(){
  if(window.EXT) return Promise.resolve();
  if(__extPromise) return __extPromise;
  __extPromise=loadScript("vendor/ext_indicators.js").then(()=>{ __extPromise=null; });
  return __extPromise;
}
function ensureEU(){
  if(window.EU_METRICS) return Promise.resolve();
  if(__euPromise) return __euPromise;
  __euPromise=loadScript("vendor/eu/eu_metrics.js").then(()=>{ __euPromise=null; });
  return __euPromise;
}

/* ---------- 区域解析（从 key 取显示名） ---------- */
function resolveName(it){
  if(it.t==="country"){ const o=window.WB&&window.WB[it.k]; return o?o.cn:it.k; }
  if(it.t==="prov") return it.k;
  if(it.t==="usstate") return it.k;
  if(it.t==="jppref") return it.k;
  if(it.t==="nutspref"){ const d=window.EU_METRICS&&window.EU_METRICS[it.k]; return d?d.name:it.k; }
  if(it.t==="city") return (typeof cityName==="function"&&cityName(it.k))||it.k;
  return it.k;
}
function regFor(it){ return regForItem(it); }
function seriesFor(it){
  /* 多年序列（折线）：reg.series(m) 返回 {years, values} 或 null */
  const r = regFor(it);
  if(!r||!r.series) return null;
  try{ return r.series(metric); }catch(e){ return null; }
}

/* ---------- 导出（B5）：当前对比 → CSV / JSON ---------- */
function csvCell(s){ return /[",\n\r]/.test(s) ? '"'+String(s).replace(/"/g,'""')+'"' : String(s); }
function downloadBlob(blob, fn){
  const u=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=u; a.download=fn; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 1500);
}
function exportCompare(fmt){
  if(!cmpList.length){ alert("请先在左侧添加至少一个对比区域"); return; }
  const unit = (typeof currencyTag==="function" && currencyTag(metric)) || "—";
  const rows = cmpList.map(it=>{
    const r = regFor(it);
    const s = (r&&r.series) ? r.series(metric) : null;
    const yrs = (s&&s.years) ? s.years.slice() : [];
    const ser = {};
    if(yrs.length){ s.years.forEach((y,i)=>{ ser[y]=s.values[i]; }); }
    const cur = r ? regGet(r, metric, +dataYear) : null;
    const curYear = r ? regValueYear(r, metric, +dataYear) : null;
    return { name:it.name, type:it.t, metric, year:+dataYear, current:cur, currentYear:curYear, series:ser, years:yrs };
  });
  if(fmt==="json"){
    const payload = { metric, unit, year:+dataYear, exportedAt:new Date().toISOString(), count:rows.length, regions:rows };
    downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),
                 `atlas-compare-${metric}-${dataYear}.json`);
  } else {
    const allYears = [...new Set(rows.flatMap(r=>r.years))].sort((a,b)=>a-b);
    let csv = "区域,层级,指标,单位,"+dataYear+"年值,实际数据年";
    allYears.forEach(y=> csv += ","+y);
    csv += "\n";
    rows.forEach(r=>{
      const cur = (r.current==null)?"":r.current;
      let line = [csvCell(r.name), csvCell(r.type), csvCell(r.metric), csvCell(unit), csvCell(cur), csvCell(r.currentYear==null?"":r.currentYear)].join(",");
      allYears.forEach(y=>{ const v = r.series[y]; line += ","+(v==null?"":v); });
      csv += line + "\n";
    });
    downloadBlob(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}),
                 `atlas-compare-${metric}-${dataYear}.csv`);
  }
}

/* ---------- 层级单元选择（按层级浏览添加对比单元） ---------- */
/* ===== C10 分享：把当前对比集(区域+指标+年份)序列化为可分享 URL 并复制 ===== */
function buildShareUrl(){
  const p=new URLSearchParams();
  cmpList.forEach(it=>p.append("add", unitKey(it.t,it.k,it.pa)));
  if(metric) p.set("metric", metric);
  if(dataYear) p.set("year", dataYear);
  const q=p.toString();
  return location.origin + location.pathname + (q ? ("?"+q) : "");
}
function _shareFeedback(ok){
  const b=document.getElementById("btnShare"); if(!b) return;
  const t=b.getAttribute("data-label")||b.textContent;
  b.setAttribute("data-label", t);
  b.textContent = ok ? "✓ 已复制" : "复制失败";
  setTimeout(()=>{ b.textContent=t; }, 1600);
}
function _fallbackCopy(url){
  try{
    const ta=document.createElement("textarea"); ta.value=url;
    ta.style.position="fixed"; ta.style.left="-9999px"; document.body.appendChild(ta);
    ta.select(); const ok=document.execCommand("copy"); ta.remove();
    if(ok){ _shareFeedback(true); } else { window.prompt("复制此链接分享对比：", url); _shareFeedback(false); }
  }catch(e){ window.prompt("复制此链接分享对比：", url); _shareFeedback(false); }
}
function copyShareLink(){
  if(!cmpList.length){ alert("请先添加至少一个对比区域再分享"); return; }
  const url=buildShareUrl();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>_shareFeedback(true), ()=>_fallbackCopy(url));
  } else { _fallbackCopy(url); }
}
window.buildShareUrl=buildShareUrl; window.copyShareLink=copyShareLink;   // 供测试断言
function unitKey(t,k,pa){ return pa!=null ? t+":"+k+":"+pa : t+":"+k; }
function isAdded(t,k){ return cmpList.some(x=>x.t===t&&x.k===k); }
/* 统一 key 解析：city:adcode:pa → {t,k,pa}；其余 t:k（k 可含冒号时保留整段） */
function parseAddKey(key){
  const parts=String(key).split(":");
  const t=parts[0];
  if(!t||parts.length<2) return null;
  if(parts.length>2) return {t, k:parts[1], pa:+parts[2]};
  return {t, k:parts.slice(1).join(":"), pa:undefined};
}
function renderUnitList(){
  const lv=document.getElementById("levelSel").value;
  const box=document.getElementById("unitList");
  const q=(document.getElementById("addInput").value||"").trim().toLowerCase();
  let items=[];
  if(lv==="country"){
    items=COUNTRIES.map(c=>[c[0], unitKey("country",c[2]), regGet(regCountry(c[2]),metric,dataYear)]);
  } else if(lv==="prov"){
    items=Object.keys(CN).map(k=>[k, unitKey("prov",k), regGet(regProv(k),metric,dataYear)]);
  } else if(lv==="usstate"){
    items=Object.keys(US_STATES_GDP).map(k=>[k, unitKey("usstate",k), regGet(regUSState(k),metric,dataYear)]);
  } else if(lv==="jppref"){
    items=Object.keys(JP_METRICS).map(k=>[k, unitKey("jppref",k), regGet(regJapanPref(k),metric,dataYear)]);
  } else if(lv==="nutspref"){
    if(!window.EU_METRICS){
      box.innerHTML='<div class="empty">正在加载欧盟 NUTS2 数据…</div>';
      ensureEU().then(renderUnitList).catch(()=>{ box.innerHTML='<div class="empty">欧盟数据加载失败</div>'; });
      return;
    }
    items=Object.keys(EU_METRICS).map(k=>[EU_METRICS[k].name, unitKey("nutspref",k), regGet(regNUTS(k),metric,dataYear)]);
  } else if(lv==="city"){
    /* 城市值必须走 regGet：cm.gdp 是人民币元，直接按 $ 格式化会夸大约 7 倍，
       且不随指标/年份变化（2026-10-24 审计 P1）。 */
    items=window.CITY_INDEX.map(x=>{
      const cm=getCityMetric(x[1],x[2]);
      const r=cm?regCity(cm,x[1]):null;
      return [x[0], unitKey("city",x[1],x[2]), r?regGet(r,metric,dataYear):null];
    });
  }
  if(q) items=items.filter(it=>it[0].toLowerCase().includes(q));
  items.sort((a,b)=>(b[2]||-1)-(a[2]||-1));
  if(!items.length){ box.innerHTML=`<div class="empty">当前层级无「${esc(q)||"数据"}」</div>`; return; }
  box.innerHTML=items.map(it=>{
    const pk=parseAddKey(it[1]);
    const added=pk?isAdded(pk.t,pk.k):false;
    return `<div class="unit${added?" added":""}" data-key="${it[1]}" title="点击${added?"移除":"加入"}对比">
      <span>${esc(it[0])}</span>
      <span class="uval">${it[2]!=null?esc(metricFmt(metric,it[2])):"—"}</span>
      <span class="ucheck">${added?"✓":""}</span></div>`;
  }).join("");
  box.querySelectorAll(".unit").forEach(el=>{
    el.onclick=()=>{
      const pk=parseAddKey(el.dataset.key); if(!pk) return;
      const idx=cmpList.findIndex(x=>x.t===pk.t&&x.k===pk.k);
      if(idx>=0) cmpList.splice(idx,1); else addItem(pk.t,pk.k,pk.pa);
      renderList(); renderChart(); renderUnitList();
    };
  });
}
/* ---------- 渲染 ---------- */
function renderList(){
  const box=document.getElementById("cmpItems");
  const tip=document.getElementById("emptyTip");
  document.getElementById("cmpHead").textContent="对比列表（"+cmpList.length+" 项）";
  tip.style.display = cmpList.length ? "none" : "block";
  box.innerHTML = cmpList.map((it,i)=>{
    const r=regFor(it);
    const raw=r?regGet(r,metric,dataYear):null;
    const vy=r?regValueYear(r,metric,dataYear):null;
    let v=raw!=null?metricFmt(metric,raw):"—";
    /* 2026-10-24：回退年必须显式标出（如省级人口只有 2023），不能让它看起来像所选 2015 年 */
    if(raw!=null && vy!=null && String(vy)!==String(dataYear)) v+=`（${vy}）`;
    return `<div class="cmp-item" title="实际数据年 ${esc(vy==null?"":vy)}"><button class="del" data-i="${i}" aria-label="移除">×</button>
      <span class="nm">${esc(it.name)}</span><span class="val">${esc(v)}</span></div>`;
  }).join("");
  box.querySelectorAll(".del").forEach(b=>{
    b.onclick=()=>{ cmpList.splice(+b.dataset.i,1); renderList(); renderChart(); };
  });
}
function renderChart(){
  const el=document.getElementById("trendChart");
  const chart=echarts.getInstanceByDom(el)||echarts.init(el);
  const series=[];
  cmpList.forEach(it=>{
    const s=seriesFor(it);
    if(s&&s.years&&s.values){ series.push({name:it.name, years:s.years, values:s.values}); }
  });
  if(series.length>=2){
    // 多年折线叠加（轨迹对比）
    const allYears=[...new Set(series.flatMap(s=>s.years))].sort((a,b)=>a-b);
    chart.setOption({
      backgroundColor:"transparent",
      tooltip:{trigger:"axis", formatter:ps=>{
        const y=ps[0].axisValue; let rows=[`<b>${y}</b>`];
        ps.forEach(p=>{ rows.push(`${p.seriesName}: <b style="color:${p.color}">${metricFmt(metric,p.value)}</b>`); });
        return rows.join("<br/>"); }},
      legend:{textStyle:{color:"#9fb3c8"},top:0},
      grid:{left:70,right:24,top:32,bottom:36,containLabel:true},
      xAxis:{type:"category",data:allYears,axisLabel:{color:"#7f93a8",fontSize:10}},
      yAxis:{type:"value",axisLabel:{color:"#7f93a8",fontSize:10,formatter:v=>metricFmt(metric,v).replace(/[¥$]/,"")},
        splitLine:{lineStyle:{color:"#0e2233"}}},
      series:series.map((s,i)=>({name:s.name,type:"line",smooth:true,showSymbol:false,
        data:allYears.map(y=>{ const idx=s.years.indexOf(y); return idx>=0?s.values[idx]:null; }),
        lineStyle:{width:2},itemStyle:{}}))
    });
    document.getElementById("hint").textContent="多年轨迹对比（"+metricLabel(metric)+"，可切换指标/年份）。";
  } else {
    chart.clear();
    document.getElementById("hint").textContent = "选择 ≥2 个区域显示轨迹对比；当前 "+(cmpList.length||0)+" 项。";
  }
  window.__cmpChart=chart;
}

/* ---------- 添加区域 ---------- */
function addItem(t,k,pa){
  if(cmpList.some(x=>x.t===t&&x.k===k)) return;
  const name=resolveName({t,k,pa});
  cmpList.push({t,name,k,pa});
  renderList(); renderChart();
}
async function parseAddParam(){
  const p=new URLSearchParams(location.search);
  const adds=p.getAll("add");
  if(adds.some(a=>a.indexOf("nutspref:")===0) && !window.EU_METRICS){
    try{ await ensureEU(); }catch(e){}
  }
  adds.forEach(add=>{ const pk=parseAddKey(add); if(pk&&pk.t&&pk.k) addItem(pk.t,pk.k,pk.pa); });
  // C10：回读指标/年份，使分享的链接能还原完整视图（入站此前只还原 add 列表）
  const mt=p.get("metric");
  if(mt&&window.METRICS&&METRICS[mt]){
    if(metricScope(mt)==="world" && !window.EXT){ try{ await ensureEXT(); }catch(e){} }
    metric=mt; const seg=document.getElementById("metricSeg"); if(seg)[...seg.children].forEach(b=>b.classList.toggle("active",b.dataset.m===mt));
  }
  const yr=p.get("year"); if(yr&&!isNaN(+yr)){ dataYear=String(yr); const sel=document.getElementById("yearSel"); if(sel) sel.value=dataYear; }
}
/* 搜索添加：国家/省/州/县/城市 */
function doAddSearch(q){
  q=(q||"").trim().toLowerCase(); if(!q) return;
  const box=document.getElementById("addResults");
  /* EU 指标数据按需加载：首次搜索时后台拉取，完成后自动重跑当前查询 */
  if(!window.EU_METRICS && !window.__euSearchLoading){
    window.__euSearchLoading=true;
    ensureEU().then(()=>{ window.__euSearchLoading=false; const top=document.getElementById("addInputTop"); if(top && top.value.trim().toLowerCase()===q) doAddSearch(q); })
             .catch(()=>{ window.__euSearchLoading=false; });
  }
  const hits=[];
  const c=COUNTRIES.find(x=>x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));
  if(c) hits.push(`<div class="cmp-item" data-add="country:${c[2]}"><span class="nm">${esc(c[0])}（国家）</span></div>`);
  const pk=Object.keys(CN).find(x=>x.toLowerCase().includes(q));
  if(pk) hits.push(`<div class="cmp-item" data-add="prov:${pk}"><span class="nm">${esc(pk)}（省）</span></div>`);
  if(window.US_STATES_GDP){
    const sk=Object.keys(US_STATES_GDP).find(x=>x.toLowerCase().includes(q));
    if(sk) hits.push(`<div class="cmp-item" data-add="usstate:${sk}"><span class="nm">${esc(sk)}（州）</span></div>`);
  }
  if(window.JP_METRICS){
    const jk=Object.keys(JP_METRICS).find(x=>x.toLowerCase().includes(q));
    if(jk) hits.push(`<div class="cmp-item" data-add="jppref:${jk}"><span class="nm">${esc(jk)}（县）</span></div>`);
  }
  if(window.EU_METRICS){
    const nk=Object.keys(EU_METRICS).find(k=>EU_METRICS[k].name.toLowerCase().includes(q));
    if(nk) hits.push(`<div class="cmp-item" data-add="nutspref:${nk}"><span class="nm">${esc(EU_METRICS[nk].name)}（NUTS2）</span></div>`);
  }
  if(window.CITY_INDEX){
    const hit=window.CITY_INDEX.find(x=>x[0].toLowerCase().includes(q));
    if(hit) hits.push(`<div class="cmp-item" data-add="city:${hit[1]}:${hit[2]}"><span class="nm">${esc(hit[0])}（市）</span></div>`);
  }
  if(!hits.length){ box.style.display="block"; box.innerHTML=`<div class="empty">未找到「${esc(q)}」</div>`; return; }
  box.style.display="block";
  box.innerHTML=hits.join("");
  box.querySelectorAll("[data-add]").forEach(el=>{
    el.onclick=()=>{
      const pk=parseAddKey(el.dataset.add);
      if(pk) addItem(pk.t,pk.k,pk.pa);
      box.style.display="none";
      document.getElementById("addInput").value="";
      const top=document.getElementById("addInputTop"); if(top) top.value="";
    };
  });
}

/* ---------- 指标/年份 ---------- */
function initMetrics(){
  const seg=document.getElementById("metricSeg");
  Object.keys(METRICS).forEach((m,i)=>{
    const b=document.createElement("button");
    b.dataset.m=m; b.textContent=METRICS[m].label;
    if(m==="gdp") b.classList.add("active");
    seg.appendChild(b);
  });
  seg.addEventListener("click", async e=>{
    const b=e.target.closest("button"); if(!b) return;
    const m=b.dataset.m;
    if(metricScope(m)==="world" && !window.EXT){
      try{ await ensureEXT(); }catch(err){ alert("扩展指标数据加载失败，请检查网络"); return; }
    }
    metric=m;
    [...seg.children].forEach(x=>x.classList.toggle("active",x===b));
    renderList(); renderChart(); renderUnitList();
  });
}
function initYear(){
  const sel=document.getElementById("yearSel");
  // 与主页面一致：动态从 WB 数据生成（2000-2024）+ 省级 2025 初核；缺 2025 的国家按最近年回退
  const yrs=new Set();
  Object.values(window.WB||{}).forEach(o=>Object.keys(o.years||{}).forEach(y=>yrs.add(+y)));
  const arr=[...yrs].sort((a,b)=>b-a);
  if(!arr.includes(2025)) arr.unshift(2025);
  sel.innerHTML=arr.map(y=>`<option value="${y}"${y===2025?" selected":""}>${y}</option>`).join("");
  dataYear="2025";
  sel.addEventListener("change",e=>{ dataYear=e.target.value; renderList(); renderChart(); });
}

window.addEventListener("load",async ()=>{
  initMetrics(); initYear();
  document.getElementById("btnCsv").addEventListener("click",()=>exportCompare("csv"));
  document.getElementById("btnJson").addEventListener("click",()=>exportCompare("json"));
  document.getElementById("btnShare").addEventListener("click",()=>copyShareLink());
  await parseAddParam();
  renderList(); renderChart(); renderUnitList();
  document.getElementById("levelSel").addEventListener("change",()=>{ renderUnitList(); });
  document.getElementById("addInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){ if(e.target.id==="addInputTop") doAddSearch(e.target.value); else renderUnitList(); } });
  document.getElementById("addInput").addEventListener("input",()=>{ renderUnitList(); });
  document.getElementById("addInput").addEventListener("blur",()=>setTimeout(()=>{ document.getElementById("addResults").style.display="none"; },200));
  const top=document.getElementById("addInputTop");
  if(top){
    top.addEventListener("keydown",e=>{ if(e.key==="Enter") doAddSearch(e.target.value); });
    top.addEventListener("input",()=>{ if(e.target.value) doAddSearch(e.target.value); });
    top.addEventListener("blur",()=>setTimeout(()=>{ document.getElementById("addResults").style.display="none"; },200));
  }
  window.addEventListener("resize",()=>{ const c=echarts.getInstanceByDom(document.getElementById("trendChart")); if(c) c.resize(); });
});
</script>
